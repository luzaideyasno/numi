<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numi — panel docente</title>
<script type="module" src="numi-db.js" onerror="window.NUMIDB_FAIL=1;dispatchEvent(new Event('numidbfail'))"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: claro y tranquilo, una herramienta de trabajo para profesores, con el cariño de la marca Numi
   IDEA: la planilla del profesor convertida en tablero: quién jugó, cómo le fue y qué nota lleva
   PICTURE: el resumen del salón con cifras grandes, barras por isla y la lista de niñas que necesitan apoyo
   COLOUR and TYPE: blanco y tinta morada oscura, coral como acento, turquesa para lo logrado, amarillo para alertas; Fredoka títulos y Nunito texto
   LAYOUT: barra superior, pestañas que se desplazan en el celular, tarjetas y tablas que se apilan bajo 600px */
:root{color-scheme:light dark;
--bg:light-dark(#f7f4fb,#17132a);--ink:light-dark(#2b1d3a,#f3ecff);--card:light-dark(#fff,#241d3d);--line:light-dark(#e9e1f2,#3a3058);
--muted:light-dark(#6f6383,#bcaed3);--soft:light-dark(#fbeff3,#3a2846);--coral:#e9456f;--teal:#13998b;--gold:#f2b01e;--blue:#3d8bd9;
--ok:light-dark(#e3f6f3,#1d4440);--warn:light-dark(#fff4d6,#4a3a17);--bad:light-dark(#fde6ec,#4d2232);
--s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;--r:18px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,40px)}h2{font-size:clamp(24px,5vw,30px)}h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:max(4vw,16px)}
.muted{color:var(--muted)}
.demo{display:inline-block;background:var(--warn);color:light-dark(#7a5500,#ffd77a);font-weight:700;font-size:13px;border-radius:99px;padding:2px 10px}
/* barra */
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;gap:var(--s2);min-height:64px}
.brand{display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:700;font-size:21px;margin-right:auto;min-height:44px}
.brand svg{width:38px;height:38px;flex:none}.brand span{display:grid;line-height:1.05;text-align:left}.brand small{font-family:Nunito,sans-serif;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.demo{white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.av{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--coral);color:#fff;font-weight:800;box-shadow:0 3px 0 #b72f53}
.btn.alt{background:var(--teal);box-shadow:0 3px 0 #0b6c62}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btn:active{transform:translateY(2px);box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.link{color:var(--coral);font-weight:700;text-decoration:underline;min-height:44px}
/* ingreso */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login .art{background:#ffc93c;display:grid;place-items:center;padding:var(--s5)}
.login .art svg{width:min(70%,320px);height:auto}
.login form{display:grid;align-content:center;gap:var(--s3);padding:var(--s5) max(6vw,20px);max-width:520px;width:100%;justify-self:center}
label{font-weight:700;font-size:15px;display:block;margin-bottom:6px}
input,select,textarea{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
textarea{min-height:80px;resize:vertical}
/* pestañas */
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:var(--s2) 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:99px;font-weight:800;font-size:15px;color:var(--muted);background:var(--card);border:2px solid var(--line)}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
main{padding-block:var(--s3) 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;color:var(--muted)}
/* tarjetas */
.grid{display:grid;gap:var(--s3)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);margin-bottom:var(--s3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.card>h3{margin-bottom:var(--s2)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3)}
.kpi b{display:block;font-family:Fredoka,sans-serif;font-size:clamp(28px,5vw,38px);line-height:1.1;white-space:nowrap}
.kpi span{font-size:14px;color:var(--muted);font-weight:700}
.kpi.c1 b{color:var(--coral)}.kpi.c2 b{color:var(--teal)}.kpi.c3 b{color:var(--blue)}.kpi.c4 b{color:light-dark(#b07d00,#ffd77a)}
.salones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--s3);margin-top:var(--s4)}
.salon{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:var(--s4);text-align:left;display:grid;gap:var(--s2)}
.salon:hover{border-color:var(--coral)}
.salon .big{font-family:Fredoka,sans-serif;font-size:44px;font-weight:700;color:var(--coral);line-height:1}
.salon .row3{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.salon .row3 b{color:var(--ink);font-size:18px;display:block}
/* barras */
.rows{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:122px minmax(0,1fr) 40px;align-items:center;gap:10px;font-weight:700;font-size:15px}
.track{height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--c,var(--teal))}
.hrow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:var(--s2) 0}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);font-size:14px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* listas */
.alert{display:flex;align-items:center;gap:var(--s2);padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.alert:first-of-type{border-top:0}
.alert div{flex:1}.alert b{display:block}.alert small{color:var(--muted);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.p-ok{background:var(--ok);color:light-dark(#0b6c62,#8ff0e1)}.p-warn{background:var(--warn);color:light-dark(#7a5500,#ffd77a)}.p-bad{background:var(--bad);color:light-dark(#b72f53,#ffb3c7)}.p-n{background:var(--line);color:var(--muted)}
/* tablas */
.tools{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.tools input{flex:1 1 220px;width:auto}.tools select{flex:0 1 220px;width:auto}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;font-size:15px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:800;background:light-dark(#faf7fd,#2a2247)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:light-dark(#fdf7fa,#2c2346)}
.nota{font-family:Fredoka,sans-serif;font-weight:700;font-size:17px}
.adj{font-size:11px;font-weight:800;color:var(--coral);display:block}
/* detalle */
.qs{display:flex;gap:6px;flex-wrap:wrap}
.q{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:3px 9px;font-weight:800;font-size:13px}
.q-p{background:var(--ok);color:light-dark(#0b6c62,#8ff0e1)}.q-s{background:light-dark(#e6f0fb,#1f3550);color:light-dark(#22609e,#a9cff5)}
.q-m{background:var(--warn);color:light-dark(#7a5500,#ffd77a)}.q-a{background:var(--bad);color:light-dark(#b72f53,#ffb3c7)}
.reto{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line)}
.reto:first-of-type{border-top:0}.reto small{color:var(--muted)}
.override{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.isl-row{flex-wrap:wrap}.isl-row>div{min-width:8.5em}.override input{width:76px;padding:6px 8px;text-align:right}
.isl-list{display:grid}.isl-row{display:flex;align-items:center;gap:var(--s2);padding:10px 0;border-top:1px solid var(--line)}.isl-row:first-child{border-top:0}
.isl-row div{flex:1}.isl-row b{display:block}.isl-row small{color:var(--muted);font-size:13px}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chipb{min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:14px}
.chipb.on{background:var(--teal);border-color:var(--teal);color:#fff}
.trow2{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2) 0;border-top:1px solid var(--line)}.trow2:first-of-type{border-top:0}
.trow2>div{flex:1}.trow2 b{display:block}.trow2 small{color:var(--muted);font-size:13px;display:block}
.heat td{border-bottom:2px solid var(--card)}.heat tr.sub td{font-weight:800;border-top:2px solid var(--ink)}.heat tr.tot td{font-size:16px}
/* usuarios */
.drop{border:3px dashed var(--line);border-radius:22px;padding:var(--s4);text-align:center;display:grid;gap:var(--s2);justify-items:center;background:var(--card)}
.drop svg{width:56px;height:56px;color:var(--coral)}
.drop input{display:none}
.drop .tools{justify-content:center}
.fpick{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.thumb{width:120px;height:90px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.spin{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100vh;min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:20px;text-align:center;padding:24px}
.boot-ring{position:relative;width:172px;height:172px;display:grid;place-items:center}
.boot-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:5px solid var(--line);border-top-color:var(--coral);border-right-color:var(--gold);animation:sp 1s linear infinite}
.boot-ring svg{width:104px;height:104px;margin-top:6px}
.boot p{margin:0;font-weight:700;font-size:17px;color:var(--muted)}
.olist{display:grid}.orow{display:flex;align-items:center;gap:var(--s2);padding:8px 0;border-top:1px solid var(--line)}.orow:first-child{border-top:0}
.onum{width:26px;color:var(--muted);font-weight:800;text-align:right;flex:none}.ofld{flex:1;display:grid;gap:4px}.ofld input{padding:8px 12px}.ofld small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ofld .pic svg{width:20px;height:20px}
.pic{display:inline-flex;gap:4px}.pic svg{width:26px;height:26px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--s2)}
.ucard{border:2px dashed var(--muted);border-radius:16px;padding:var(--s2) var(--s3);background:var(--card);display:grid;gap:4px}
.ucard b{font-family:Fredoka,sans-serif;font-size:18px}.ucard code{font-size:15px;font-weight:700;color:var(--coral)}
.ucard .pic svg{width:34px;height:34px}
.phone{width:260px;max-width:100%;margin:0 auto;border:8px solid var(--ink);border-radius:34px;padding:var(--s3);background:#fff8ee;color:#2b1d3a;display:grid;gap:var(--s2);text-align:center}
.phone input{background:#fff;border-color:#f0dbe1;color:#2b1d3a}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.picks span{background:#fff;border:2px solid #f0dbe1;border-radius:14px;padding:8px;display:grid;place-items:center}
.picks span.on{border-color:#e9456f;background:#ffeef2}
.picks svg{width:32px;height:32px}
/* config */
.scale{display:grid;gap:var(--s2)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:var(--s2);align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow b{display:block}.srow small{color:var(--muted);font-size:14px}
.srow input{text-align:right;font-family:Fredoka,sans-serif;font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:14px;font-weight:700;z-index:30;max-width:92vw;text-align:center}
.task{display:grid;gap:8px;padding:var(--s3) 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}
.task .top{display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-weight:700;color:var(--coral);min-height:32px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:var(--s2);align-items:end}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.login{grid-template-columns:1fr}.login .art{padding:var(--s4)}.login .art svg{width:150px}.who span{display:none}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:9.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:9em;margin-inline-start:-9em;white-space:normal;color:var(--muted);font-size:13px;font-weight:700}.stack td:empty{display:none}.stack td.n{text-align:start}.card{padding:var(--s3)}.hrow{grid-template-columns:112px minmax(0,1fr) 34px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.pw{position:relative;display:block}.pw input{padding-right:54px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:46px;height:46px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:12px}.eye svg{width:24px;height:24px}
#print{display:none}
.modal{position:fixed;inset:0;background:rgb(23 19 42/.55);display:grid;place-items:center;padding:20px;z-index:40}
.sheet{max-width:440px;width:100%;max-height:calc(100dvh - 40px);overflow:auto}
.who .out{display:inline;color:var(--coral);font-size:15px}.help{flex:none}
.menu{display:grid;gap:8px;margin-top:var(--s2)}.menu button{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:16px;text-align:left;padding:0 16px;color:var(--ink)}.menu .danger{color:var(--coral)}
.dots{flex:none;width:44px;height:44px;border-radius:50%;border:0;font-size:24px;font-weight:900;line-height:1;color:var(--muted);background:transparent}.dots:hover,.dots:focus-visible{background:var(--bg);color:var(--ink)}
.slist{display:grid;gap:10px;margin-top:var(--s2)}@media(min-width:760px){.slist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 4px 4px 12px;transition:border-color .15s}.scard:hover{border-color:var(--muted)}
.scard-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:68px;padding:8px 0;color:inherit}
.scard .sc-av{width:42px;height:42px;font-size:15px;font-style:normal;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.sc-txt{flex:1;min-width:0;display:grid;gap:4px}.sc-txt b{font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.sc-txt small{color:var(--muted);font-size:13px;font-weight:700}
.sc-bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line);max-width:170px}.sc-bar i{display:block;height:100%}
.sc-nota{flex:none;display:grid;justify-items:end;gap:3px}.sc-nota b{font-family:Fredoka,sans-serif;font-size:24px;line-height:1;font-weight:700}
.legend-mini{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:var(--s2);font-size:13px;font-weight:700;color:var(--muted)}.legend-mini i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ulist{display:grid;margin-top:var(--s2)}.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.urow:first-child{border-top:0}
.u-txt{display:grid;gap:2px}.u-txt b{font-size:15px}.u-txt small{color:var(--muted);font-size:13px;font-weight:700}.urow .pic svg{width:24px;height:24px}
.u-act{grid-column:1/-1;display:flex;gap:16px}.u-act .link{min-height:32px;font-size:14px}
.orow.doubt{background:var(--warn);border-radius:12px;padding-inline:8px;border-top-color:transparent}.why{color:light-dark(#7a5500,#ffd77a);font-weight:800;font-size:13px}
.flipbox{display:grid;gap:6px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:var(--s2)}.flipbox .btn{justify-self:start}
[data-sc].bad,#ovin.bad{border-color:var(--coral);background:var(--bad)}
.howto details{border-top:1px solid var(--line);padding:10px 0}.howto summary{font-weight:800;font-size:16px;min-height:36px;cursor:pointer}.howto ol{margin:8px 0 8px 20px;display:grid;gap:4px}
.tour-hl{position:relative;z-index:42!important;box-shadow:0 0 0 4px var(--gold),0 0 0 9999px rgb(23 19 42/.6)!important;border-radius:16px}
.tour-block{position:fixed;inset:0;z-index:44}
.tour-tip{position:fixed;left:12px;right:12px;bottom:16px;z-index:46;max-width:460px;margin:0 auto;display:grid;gap:8px}
.tour-tip .tn{display:flex;gap:10px;align-items:center}.tour-tip .tn svg{width:52px;height:52px;flex:none}
.tour-tip.up{bottom:auto;top:76px}
.tour-hand{position:fixed;z-index:47;font-size:40px;line-height:1;pointer-events:none;filter:drop-shadow(0 2px 3px rgb(0 0 0/.4));animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(8px) scale(1)}45%{transform:translateY(-4px) scale(.88)}60%{transform:translateY(-4px) scale(.88)}}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print .cards{grid-template-columns:repeat(3,1fr);gap:10px}#print .ucard{break-inside:avoid;border:2px dashed #888;color:#2b1d3a;background:#fff}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>

<symbol id="i-flor" viewBox="0 0 32 32"><g fill="#ff8fb8"><circle cx="16" cy="8" r="6"/><circle cx="24" cy="16" r="6"/><circle cx="16" cy="24" r="6"/><circle cx="8" cy="16" r="6"/></g><circle cx="16" cy="16" r="4.5" fill="#ffc93c"/></symbol>
<symbol id="i-nube" viewBox="0 0 32 32"><path d="M9 25a6 6 0 0 1-.7-12A8 8 0 0 1 23.6 11 6 6 0 0 1 24 25z" fill="#3d8bd9" stroke="#22609e" stroke-width="1.5"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</defs></svg>
<div id="root"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],root=$('#root');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>n==null?'—':n.toFixed(1).replace('.',',');
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'—';
const NUMI='<svg viewBox="0 0 120 120"><use href="#numi"/></svg>';
const PICS=['estrella','corazon','luna','sol','flor','nube'];
const pic=k=>`<svg><use href="#i-${k}"/></svg>`;
const ISL=[{k:'suma',n:'Sumas',c:'#e9456f'},{k:'resta',n:'Restas',c:'#13998b'},{k:'mult',n:'Multiplicación',c:'#f08a24'},{k:'div',n:'División',c:'#3d8bd9'},{k:'frac',n:'Fracciones',c:'#a45fd1'},{k:'prob',n:'Problemas',c:'#2b1d3a'}];
const LVN=['Calentando','En marcha','Desafío'];
const QN={p:'A la primera',s:'2.º intento',m:'3+ intentos',a:'Con ayuda'};
const DEF_SCALE={p:5,s:4,m:3.5,a:3,alert:3.6};

/* ---------- datos (Firebase) ---------- */
const DAY=864e5;let NOW=Date.now();
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]+/g,'');
const byName=(a,b)=>a.name.localeCompare(b.name,'es');
let DB=null,ME_P=null;
const D={classes:[],teachers:[],year:new Date().getFullYear(),overrides:{},notes:{}};
const GR=[3,4,5];
const clsAvg=c=>avg(c.students.map(finalNota).filter(x=>x!=null));
const clsIsl=(c,i)=>avg(c.students.map(s=>islaNota(s,i).v).filter(v=>v!=null));
const teachersOf=id=>V.role=='admin'?D.teachers.filter(t=>(t.access||[]).includes(id)).map(t=>t.name):(ME_P&&(ME_P.access||[]).includes(id)?[ME_P.name]:[]);
async function loadCourse(c){
  const [st,rs,ts,ns,sc]=await Promise.all([DB.students(c.id),DB.results(c.id),DB.tasks(c.id),DB.notes(c.id),DB.scale(c.id)]);
  c.scale={...DEF_SCALE,...(sc||{})};c.tasks=ts.sort((a,b)=>b.created-a.created);
  const by={};rs.forEach(r=>{if(r.qs&&r.qs.length)(by[r.studentUid]=by[r.studentUid]||[]).push({isl:r.isl,lvl:r.lvl,qs:r.qs,t:r.t,c})});
  c.students=st.map(x=>({...x,retos:(by[x.id]||[]).sort((a,b)=>b.t-a.t)})).sort(byName);
  ns.forEach(n=>{D.notes[n.id]=n.obs||'';Object.entries(n.ov||{}).forEach(([i,v])=>{D.overrides[n.id+'|'+i]=v})});
}
async function loadAll(){
  NOW=Date.now();D.overrides={};D.notes={};
  const cs=await DB.courses(ME_P);
  D.classes=cs.map(c=>({...c,grade:+c.grade,year:+c.year,closed:+c.year<D.year,students:[],tasks:[],scale:{...DEF_SCALE}}));
  if(ME_P.role=='admin')D.teachers=(await DB.staff()).filter(u=>u.role=='teacher').map(u=>({...u,access:u.access||[]})).sort(byName);
  await Promise.all(D.classes.map(loadCourse));
}
const first=n=>String(n||'').split(' ')[0];
const hello=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
// Celular colombiano: 3001234567 -> 573001234567; si ya trae indicativo, se deja
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==10&&d[0]=='3')d='57'+d;return d.length>=11?d:''};
const fmtPhone=p=>{const d=String(p||'').replace(/\D/g,'');return d.length==10?`${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`:p};
const fail=e=>{console.error(e);toast(DB?DB.message(e):String(e))};

/* ---------- notas ---------- */
const qv=q=>(C()?C().scale:DEF_SCALE)[q];
const retoNota=r=>r.qs.reduce((a,q)=>a+(r.c.scale[q]??DEF_SCALE[q]),0)/r.qs.length;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function islaNota(s,i){const o=D.overrides[s.id+'|'+i];if(o!=null)return{v:o,adj:true};const rs=s.retos.filter(r=>r.isl==i);return{v:rs.length?avg(rs.map(retoNota)):null,adj:false}}
function finalNota(s){const v=ISL.map((_,i)=>islaNota(s,i).v).filter(x=>x!=null);return avg(v)}
function counts(s){const c={p:0,s:0,m:0,a:0,t:0};s.retos.forEach(r=>r.qs.forEach(q=>{c[q]++;c.t++}));return c}
const desemp=n=>n==null?['Sin nota','p-n']:n>=4.6?['Superior','p-ok']:n>=4?['Alto','p-ok']:n>=3.5?['Básico','p-warn']:['Bajo','p-bad'];
const ago=t=>{if(!t)return'Nunca';const d=Math.floor((NOW-t)/DAY);return d<=0?'Hoy':d==1?'Ayer':d<7?`Hace ${d} días`:`Hace ${Math.floor(d/7)} sem.`};
const last=s=>s.retos[0]?.t;
const fdate=t=>new Date(t).toLocaleDateString('es-CO',{day:'numeric',month:'short'});

/* ---------- estado de la vista ---------- */
let V={role:'teacher',atab:'colegio',editT:null,screen:'boot',err:'',busy:false,cls:0,tab:'resumen',student:null,q:'',sort:'name',ocr:null};
function toast(m){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),Math.max(2800,m.length*65))}
const C=()=>D.classes[V.cls]||null;

const ME=()=>ME_P;
const myClasses=()=>V.role=='admin'?D.classes.filter(c=>c.year==D.year):D.classes.filter(c=>c.year==D.year&&(ME_P.access||[]).includes(c.id));
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function topbar(){const nm=ME_P?ME_P.name:'';return `<header class="bar"><div class="wrap"><button class="brand" data-a="home">${NUMI}<span>Numi <small>${V.role=='admin'?'Súper usuario':'Panel docente'}</small></span></button>
<button class="btn ghost sm help" data-a="help">Ayuda</button><button class="who" data-a="logout" title="Salir de tu cuenta"><span>${nm}</span><i class="av" style="${V.role=='admin'?'background:var(--ink)':''}">${ini(nm)}</i><b class="out">Salir</b></button></div></header>`}
const REFRESH=`<button class="link" data-a="refresh" style="font-size:15px">↻ Ver datos nuevos</button>`;

function render(){
  if(V.screen=='login')return login();
  if(V.screen=='setup')return setupView();
  if(V.screen=='newpw'){root.innerHTML=`<div class="login"><div class="art">${NUMI}</div><form id="npf">
  <h1>¡Hola, ${esc(first(ME_P.name))}! Te damos la bienvenida a Numi</h1><p class="muted">Entraste con una clave temporal. Crea ahora tu propia contraseña para el panel.</p>
  <div><label for="np1">Contraseña nueva (mínimo 6 caracteres)</label><input id="np1" type="password" autocomplete="new-password" required></div>
  <div><label for="np2">Repite la contraseña</label><input id="np2" type="password" autocomplete="new-password" required></div>
  <button class="btn" type="submit" ${V.busy?'disabled':''}>${V.busy?'Guardando…':'Guardar y entrar'}</button>
  <p style="color:var(--coral);font-weight:700;min-height:1.5em" aria-live="polite">${esc(V.err||'')}</p></form></div>`;return}
  if(V.screen=='boot'||V.screen=='loading'){root.innerHTML=`<div class="boot" role="status"><div class="boot-ring"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#numi"/></svg></div><p>${V.screen=='boot'?'Conectando…':'Cargando cursos y notas…'}</p></div>`;return}
  if(V.screen=='noaccess'){root.innerHTML=`<div class="login" style="grid-template-columns:1fr"><div class="card" style="max-width:460px;justify-self:center;align-self:center;margin:20px"><h2>Tu cuenta no tiene acceso al panel</h2><p class="muted" style="margin:8px 0 16px">Pide a la coordinación que te cree como profesor en Numi.</p><button class="btn" data-a="logout">Salir</button></div></div>`;return}
  if(V.screen=='nodb'){root.innerHTML=`<div class="login" style="grid-template-columns:1fr"><div class="card" style="max-width:460px;justify-self:center;align-self:center;margin:20px"><h2>No se pudo conectar con Numi</h2><p class="muted" style="margin-top:8px">Revisa tu conexión a internet y vuelve a abrir el panel.</p></div></div>`;return}
  let body='';
  if(V.screen=='home')body=V.role=='admin'?adminHome():home();
  else if(V.screen=='student')body=student();
  else body=salon();
  root.innerHTML=topbar()+`<main class="wrap">${body}</main>`;
  syncHash();
  if(V.screen=='home'||V.screen=='salon')setTimeout(maybeTour,400);
}
/* ---------- historial: el botón atrás navega dentro del panel ---------- */
let curH='',routingH=true,GUARD=false,guardIgnore=[];
function navHash(){
  if(V.screen=='student'&&C())return `estudiante-${C().id}-${V.student}`;
  if(V.screen=='salon'&&C())return `curso-${C().id}-${V.tab}`;
  return V.role=='admin'?V.atab:'inicio';
}
function syncHash(){const h=navHash();if(location.hash.slice(1)===h){curH=h;return}curH=h;if(routingH)location.replace('#'+h);else location.hash=h}
function applyHash(h){
  const m=h.match(/^(curso|estudiante)-([A-Za-z0-9]+)-(.+)$/);
  if(m){const i=D.classes.findIndex(c=>c.id==m[2]);if(i>=0){V.cls=i;
    if(m[1]=='curso'&&TABS.some(t=>t[0]==m[3])){V.screen='salon';V.tab=m[3];return true}
    if(m[1]=='estudiante'&&D.classes[i].students.some(x=>x.id==m[3])){V.screen='student';V.student=m[3];V.tab='estudiantes';return true}}}
  V.screen='home';if(V.role=='admin'&&['colegio','profesores','cursos'].includes(h))V.atab=h;
  return h=='inicio'||['colegio','profesores','cursos'].includes(h);
}
/* ventanas propias: más grandes y claras que las del navegador */
function sheet(html){document.querySelector('.modal')?.remove();const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card sheet" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(m);return m}
function ask({title,body='',ok='Sí, continuar',cancel='Cancelar',danger=false}){return new Promise(res=>{
  const m=sheet(`<h3>${title}</h3>${body?`<div class="muted" style="margin:8px 0 16px">${body}</div>`:'<div style="height:14px"></div>'}<div class="tools" style="margin:0"><button class="btn ${danger?'':'alt'}" data-k="ok">${ok}</button><button class="btn ghost" data-k="no">${cancel}</button></div>`);
  const done=v=>{m.remove();res(v)};m.addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(k)done(k=='ok');else if(e.target===m)done(false)});m.querySelector('[data-k=no]').focus()})}
let CREDMSG='';
function showCreds(t,pw){
  const url=location.origin+location.pathname;
  CREDMSG=`Hola ${first(t.name)}, te creamos tu cuenta en Numi, el juego de matemáticas del colegio.\n\nEntra aquí: ${url}\nCorreo: ${t.email}\nClave temporal: ${pw}\n\nCopia y pega la clave tal cual, con los guiones y la mayúscula (la palabra del final es parte de la clave, no un dibujito).\n\nAl entrar, Numi te pedirá crear tu propia contraseña.`;
  document.querySelector('.modal')?.remove();const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card sheet"><h3>Profesor creado</h3><p class="muted" style="margin:6px 0 12px">Envíale este mensaje a ${esc(t.name)}. La clave temporal solo se muestra ahora.</p>
  <pre style="white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font:15px/1.45 Nunito,sans-serif;margin:0 0 14px">${esc(CREDMSG)}</pre>
  <div class="tools" style="margin:0"><a class="btn alt" href="https://wa.me/${waNum(t.phone)}?text=${encodeURIComponent(CREDMSG)}" target="_blank" rel="noopener">${waNum(t.phone)?'Enviar por WhatsApp a '+esc(fmtPhone(t.phone)):'Enviar por WhatsApp'}</a><button class="btn ghost" data-a="credcopy">Copiar mensaje</button><button class="btn ghost" data-a="credclose">Listo</button></div></div>`;
  document.body.appendChild(m);
}
function askLeave(){
  document.querySelector('.modal')?.remove();const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card sheet"><h3>¿Quieres salir del panel?</h3><p class="muted" style="margin:6px 0 16px">Todo lo que hiciste queda guardado.</p><div class="tools" style="margin:0"><button class="btn alt" data-a="stayapp">Seguir en el panel</button><button class="btn ghost" data-a="leaveapp">Salir</button></div></div>`;
  document.body.appendChild(m);
}
addEventListener('hashchange',e=>{
  const h=e.newURL.split('#')[1]||'';
  if(guardIgnore.length&&h===guardIgnore[0]){guardIgnore.shift();return}
  if(h===curH||!ME_P||['login','setup','boot','loading','noaccess','nodb'].includes(V.screen))return;
  document.querySelector('.modal')?.remove();
  if(h==='salir'){askLeave();return}
  if(pending()&&!(Object.keys(saveT).length&&!scDirty()&&!Array.isArray(V.ocr))){const back=curH;okToLeave().then(ok=>{if(ok){routingH=true;applyHash(h);render();routingH=false;scrollTo(0,0)}else{curH=back;location.hash=back}});return}
  flushSaves();routingH=true;applyHash(h);render();routingH=false;scrollTo(0,0);
});
addEventListener('pointerdown',()=>{
  if(GUARD||!ME_P)return;const h=location.hash.slice(1);if(!h||h==='salir')return;GUARD=true;
  guardIgnore=['salir',h];curH=h;location.replace('#salir');location.hash=h;
},{capture:true});
function login(){
  root.innerHTML=`<div class="login"><div class="art">${NUMI}</div><form id="lf">
  <h1>Hola, profe</h1><p class="muted">Entra para ver cómo van tus estudiantes en Numi.</p>
  <div><label for="em">Correo del colegio</label><input id="em" type="email" autocomplete="username" required value="${esc(V.email||'')}"></div>
  <div><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit" ${V.busy?'disabled':''}>${V.busy?'Entrando…':'Entrar'}</button>
  <p style="color:var(--coral);font-weight:700;min-height:1.5em" aria-live="polite">${esc(V.err||'')}</p>
  <button class="link" type="button" data-a="forgot" style="justify-self:start">Olvidé mi contraseña</button>
  <p class="muted" style="font-size:14px">Las cuentas de profesores las crea la coordinación desde este panel y te comparte una clave temporal.</p>
  ${V.setupDone===false?`<div class="card" style="background:var(--warn);border:0"><b>¿Es la primera vez que se usa Numi en el colegio?</b><p class="muted" style="font-size:14px;margin:4px 0 10px">Crea aquí la cuenta del coordinador (súper usuario). Esta opción desaparece cuando ya existe.</p><button class="btn sm" type="button" data-a="setup">Crear cuenta del coordinador</button></div>`:''}</form></div>`;
}
function setupView(){
  root.innerHTML=`<div class="login"><div class="art">${NUMI}</div><form id="sf">
  <h1>Cuenta del coordinador</h1><p class="muted">Será el súper usuario: crea los cursos, los profesores y ve las notas de todo el colegio.</p>
  <div><label for="sn">Nombre</label><input id="sn" required placeholder="Ej.: Coordinación académica" value="${esc(V.sn||'')}"></div>
  <div><label for="se">Correo</label><input id="se" type="email" required autocomplete="username" value="${esc(V.se||'')}"></div>
  <div><label for="sp">Contraseña (mínimo 6 caracteres)</label><input id="sp" type="password" required autocomplete="new-password"></div>
  <div><label for="sp2">Repite la contraseña</label><input id="sp2" type="password" required autocomplete="new-password"></div>
  <button class="btn" type="submit" ${V.busy?'disabled':''}>${V.busy?'Creando…':'Crear y entrar'}</button>
  <p style="color:var(--coral);font-weight:700;min-height:1.5em" aria-live="polite">${esc(V.err||'')}</p>
  <button class="link" type="button" data-a="tologin" style="justify-self:start">Volver</button></form></div>`;
}
async function afterAuth(){
  V.screen='loading';render();
  try{
    ME_P=await DB.me();
    if(!ME_P){const uid=DB.user()?.uid||'';await DB.logout();V.err=`Esa cuenta no tiene acceso al panel. Pide a la coordinación que te cree como profesor.`;V.screen='login';return render()}
    V.role=ME_P.role=='admin'?'admin':'teacher';
    if(ME_P.mustChange){V.screen='newpw';V.err='';return render()}
    await loadAll();V.screen='home';routingH=true;applyHash(location.hash.slice(1));render();routingH=false;scrollTo(0,0);
  }catch(e){fail(e);V.screen='noaccess';render()}
}
function salonCard(c){const i=D.classes.indexOf(c),st=c.students,act=st.filter(s=>last(s)&&NOW-last(s)<7*DAY).length,prom=clsAvg(c),need=st.filter(s=>{const n=finalNota(s);return n==null||n<c.scale.alert}).length;
  return `<button class="salon" data-a="cls" data-i="${i}"><h2>${c.name}</h2>${V.role=='admin'?`<span class="muted" style="font-weight:700;margin-top:-6px">${teachersOf(c.id).join(', ')||'Sin profesor asignado'}</span>`:''}${st.length?`<div class="big">${f1(prom)}</div><span class="muted" style="font-weight:700;margin-top:-8px">nota promedio del curso</span>`:`<span class="pill p-warn" style="justify-self:start">Sin estudiantes todavía</span><span class="muted" style="font-size:14px">El profesor las agrega desde Usuarios, con la foto de la lista.</span>`}
  <div class="row3"><span><b>${st.length}</b>estudiantes</span><span><b>${act}</b>jugaron esta semana</span><span><b>${need}</b>necesitan apoyo</span></div></button>`}
function home(){
  const t=ME_P,gs=[...new Set(myClasses().map(c=>c.grade))].sort();
  return `<div class="head"><div><h1>${hello()}, ${esc(first(t.name))}</h1><p class="muted">Matemáticas · ${gs.map(g=>g+'.°').join(' y ')}</p></div>${REFRESH}</div>
  <div class="salones">${myClasses().map(salonCard).join('')||'<div class="card"><h3>Aún no tienes cursos asignados</h3><p class="muted" style="margin-top:6px">La coordinación te asigna los cursos desde su panel.</p></div>'}</div>`;
}
const TABS=[['resumen','Resumen'],['estudiantes','Estudiantes'],['notas','Planilla de notas'],['tareas','Tareas'],['usuarios','Usuarios'],['config','Configuración']];
function salon(){
  const c=C();

/* súper usuario */

}
function aColegio(){
  const cls=sortedCls(),all=cls.flatMap(c=>c.students);
  const glob=avg(all.map(finalNota).filter(x=>x!=null)),week=all.filter(s=>last(s)&&NOW-last(s)<7*DAY).length;
  const cell=v=>`<td class="n" style="background:${heat(v)}"><b>${f1(v)}</b></td>`;
  const gAvg=(g,i)=>{const ss=cls.filter(c=>c.grade==g).flatMap(c=>c.students);return i==null?avg(ss.map(finalNota).filter(x=>x!=null)):avg(ss.map(s=>islaNota(s,i).v).filter(v=>v!=null))};
  const tAvg=i=>avg(all.map(s=>islaNota(s,i).v).filter(v=>v!=null));
  return `<div class="kpis"><div class="kpi c1"><b>${f1(glob)}</b><span>Nota promedio global</span></div><div class="kpi c2"><b>${all.length}</b><span>Estudiantes en ${cls.length} cursos</span></div>
  <div class="kpi c3"><b>${D.teachers.length}</b><span>Profesores</span></div><div class="kpi c4"><b>${pct(week/all.length)}</b><span>Jugaron esta semana</span></div></div>
  <section class="card"><h3>Nota promedio por curso y tema</h3><p class="muted" style="font-size:14px;margin:-4px 0 var(--s2)">Verde: alto o superior · amarillo: 3,5 a 3,9 · rosado: menos de 3,5. Toca un curso para ver sus estudiantes.</p>
  <div class="scroll"><table class="heat"><thead><tr><th>Curso</th>${ISL.map(x=>`<th class="n">${x.n}</th>`).join('')}<th class="n">Global</th></tr></thead><tbody>
  ${GR.map(g=>cls.filter(c=>c.grade==g).map(c=>`<tr class="click" data-a="cls" data-i="${D.classes.indexOf(c)}"><td style="white-space:nowrap"><b>${c.name}</b><br><small class="muted">${teachersOf(c.id).join(', ')||'—'}</small></td>${ISL.map((_,i)=>cell(clsIsl(c,i))).join('')}${cell(clsAvg(c))}</tr>`).join('')+
   `<tr class="sub"><td><b>Grado ${g}.°</b></td>${ISL.map((_,i)=>cell(gAvg(g,i))).join('')}${cell(gAvg(g))}</tr>`).join('')}
  <tr class="sub tot"><td><b>Colegio</b></td>${ISL.map((_,i)=>cell(tAvg(i))).join('')}${cell(glob)}</tr></tbody></table></div></section>
  <div class="grid g2" style="margin-top:var(--s3)"><section class="card"><h3>Promedio global por grado</h3><div class="rows">${GR.map(g=>{const v=gAvg(g);return `<div class="hrow"><span>Grado ${g}.°</span><span class="track"><i style="--c:var(--coral);width:${v?v/5*100:0}%"></i></span><em>${f1(v)}</em></div>`}).join('')}</div></section>
  <section class="card"><h3>Promedio del colegio por tema</h3><div class="rows">${ISL.map((x,i)=>{const v=tAvg(i);return `<div class="hrow"><span>${x.n}</span><span class="track"><i style="--c:${x.c};width:${v?v/5*100:0}%"></i></span><em>${f1(v)}</em></div>`}).join('')}</div></section></div>
  <div class="tools" style="margin-top:var(--s3)"><button class="btn alt" data-a="xlsxall">Descargar consolidado en Excel</button><button class="btn ghost" data-a="copyall">Copiar la tabla</button></div>`;
}
function accessPicker(sel,prefix){
  return GR.map(g=>{const cs=sortedCls().filter(c=>c.grade==g),allOn=cs.every(c=>sel.includes(c.id));
    return `<div class="acc"><button type="button" class="chipb ${allOn?'on':''}" data-a="${prefix}g" data-g="${g}">Todo ${g}.°</button>${cs.map(c=>`<button type="button" class="chipb ${sel.includes(c.id)?'on':''}" data-a="${prefix}c" data-c="${c.id}">${c.name}</button>`).join('')}</div>`}).join('');
}
let NT={name:'',email:'',phone:'',access:[]},NC={grade:3,name:'',year:new Date().getFullYear(),teachers:[]},VY=new Date().getFullYear(),EC=null,ECT=[];
const nextName=(g,y)=>{const used=D.classes.filter(c=>c.year==y&&c.grade==g).map(c=>c.name);for(const L of 'ABCDEFGH'){const n=`${g}.°${L}`;if(!used.includes(n))return n}return g+'.°'};

  const years=[...new Set(D.classes.map(c=>c.year).concat(D.year))].sort(),cls=sortedCls(VY),next=D.year+1,hasNext=D.classes.some(c=>c.year==next);
  if(!NC.name)NC.name=nextName(NC.grade,NC.year);
  return `<div class="grid g2"><section class="card" style="align-self:start"><h3>Crear curso</h3><p class="muted" style="font-size:14px;margin:-4px 0 var(--s3)">Cada año cambian los cursos: créalos aquí y asígnales profesor.</p>
  <div class="fields"><div><label for="ncy">Año lectivo</label><select id="ncy">${[D.year,next].map(y=>`<option ${NC.year==y?'selected':''}>${y}</option>`).join('')}</select></div>
  <div><label for="ncg">Grado</label><select id="ncg">${GR.map(g=>`<option value="${g}" ${NC.grade==g?'selected':''}>${g}.°</option>`).join('')}</select></div>
  <div><label for="ncn">Nombre del curso</label><input id="ncn" value="${esc(NC.name)}" placeholder="Ej.: 5.°C"></div></div>
  <label style="margin-top:var(--s3)">Profesores del curso</label><div class="acc">${D.teachers.map(t=>`<button type="button" class="chipb ${NC.teachers.includes(t.id)?'on':''}" data-a="nct" data-id="${t.id}">${esc(t.name)}</button>`).join('')}</div>
  <button class="btn" data-a="ncsave" style="margin-top:var(--s2)">Crear curso</button>
  <div class="note" style="background:var(--soft);border-radius:14px;padding:var(--s3);margin-top:var(--s4)"><b>Nuevo año lectivo</b><p class="muted" style="font-size:14px;margin:4px 0 var(--s2)">${hasNext?`Ya hay cursos creados para ${next}.`:`Crea de una vez los cursos de ${next} con los mismos nombres de ${D.year}, sin estudiantes ni profesores, y luego ajústalos.`}</p>
  ${hasNext?'':`<button class="btn alt sm" data-a="copyyear">Preparar ${next} copiando los cursos de ${D.year}</button>`}</div></section>
  <section class="card"><div class="tools" style="margin-bottom:var(--s2);align-items:center"><h3 style="margin-right:auto">Cursos ${VY}</h3>${years.map(y=>`<button class="chipb ${VY==y?'on':''}" data-a="vy" data-y="${y}">${y}${y<D.year?' · cerrado':y>D.year?' · próximo':''}</button>`).join('')}</div>
  ${cls.length?GR.map(g=>{const cs=cls.filter(c=>c.grade==g);return cs.length?`<p class="lab" style="margin:var(--s3) 0 4px;font-weight:800">Grado ${g}.°</p>`+cs.map(c=>{const i=D.classes.indexOf(c);
    if(EC==c.id)return `<div class="trow2" style="display:block"><div class="fields"><div><label for="ecn">Nombre</label><input id="ecn" value="${esc(c.name)}"></div></div>
      <label style="margin-top:var(--s2)">Profesores</label><div class="acc">${D.teachers.map(t=>`<button type="button" class="chipb ${ECT.includes(t.id)?'on':''}" data-a="ect" data-id="${t.id}" data-c="${c.id}">${esc(t.name)}</button>`).join('')}</div>
      <div class="tools" style="margin:var(--s2) 0 0"><button class="btn sm alt" data-a="ecsave" data-c="${c.id}">Guardar</button><button class="btn sm ghost" data-a="ecx">Cancelar</button>
      ${c.students.length?`<span class="muted" style="font-size:13px;align-self:center">No se puede eliminar: tiene ${c.students.length} estudiantes.</span>`:`<button class="btn sm ghost" style="color:var(--coral)" data-a="ecdel" data-c="${c.id}">Eliminar curso</button>`}</div></div>`;
    return `<div class="trow2"><i class="av" style="background:${c.closed?'var(--muted)':'var(--teal)'}">${c.name.replace('.°','')}</i><div><b>${esc(c.name)}</b><small>${c.students.length} estudiantes · ${teachersOf(c.id).join(', ')||'<span style="color:var(--coral)">sin profesor</span>'}</small></div>
    <span class="tools" style="margin:0;flex-wrap:nowrap"><button class="btn ghost sm" data-a="cls" data-i="${i}">Ver</button>${c.closed?'':`<button class="btn ghost sm" data-a="ecedit" data-c="${c.id}">Editar</button>`}</span></div>`}).join(''):''}).join(''):`<p class="muted">No hay cursos en ${VY}.</p>`}</section></div>`;
}
function aProfes(){
  return `<div class="grid g2"><section class="card" style="align-self:start"><h3>Crear profesor</h3><p class="muted" style="font-size:14px;margin:-4px 0 var(--s3)">Numi genera una clave temporal y un mensaje para enviárselo por WhatsApp. Solo verá los cursos que le asignes.</p>

    ${V.editT==t.id?`<div style="margin-top:var(--s2)"><label for="etp" style="margin-top:4px">Celular (WhatsApp)</label><input id="etp" type="tel" inputmode="tel" value="${esc(t.phone||'')}" placeholder="300 123 4567" style="margin-bottom:10px">${accessPicker(t.access,'et')}<div class="tools" style="margin:var(--s2) 0 0"><button class="btn sm alt" data-a="etdone">Listo</button><button class="btn sm ghost" style="color:var(--coral)" data-a="etdel" data-id="${t.id}">Eliminar profesor</button></div></div>`:''}</div>
    ${V.editT==t.id?'':`<button class="btn ghost sm" data-a="etedit" data-id="${t.id}">Editar acceso</button>`}</div>`}).join('')}</section></div>`;

function toggleAccess(list,a,b){
  if(a.endsWith('g')){const ids=D.classes.filter(c=>c.grade==+b.dataset.g).map(c=>c.id),on=ids.every(i=>list.includes(i));ids.forEach(i=>{const k=list.indexOf(i);if(on&&k>=0)list.splice(k,1);if(!on&&k<0)list.push(i)})}
  else{const i=b.dataset.c,k=list.indexOf(i);k>=0?list.splice(k,1):list.push(i)}
}
function copyAll(){
  const rows=[['Curso','Profesor','Estudiante',...ISL.map(x=>x.n),'Final','Desempeño']],fx=v=>v==null?'':v.toFixed(1).replace('.',',');
  sortedCls().forEach(c=>c.students.forEach(s=>{const n=finalNota(s);rows.push([c.name,teachersOf(c.id).join(' / '),s.name,...ISL.map((_,i)=>fx(islaNota(s,i).v)),fx(n),desemp(n)[0]])}));
  navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n')).then(()=>toast('Consolidado copiado: todos los cursos y estudiantes.'),()=>toast('No se pudo copiar en este navegador.'));
}

/* resumen */
function resumen(){
  const st=C().students;if(!st.length)return `<section class="card"><h3>Este curso todavía no tiene estudiantes</h3><p class="muted" style="margin-top:6px">Ve a la pestaña <b>Usuarios</b> y sube la foto de la lista del salón para crearlas.</p><button class="btn" data-a="tab" data-t="usuarios" style="margin-top:var(--s3)">Ir a Usuarios</button></section>`;
  const week=st.filter(s=>last(s)&&NOW-last(s)<7*DAY),all={p:0,s:0,m:0,a:0,t:0};
  st.forEach(s=>{const c=counts(s);for(const k in all)all[k]+=c[k]});
  const notas=st.map(finalNota).filter(x=>x!=null),prom=avg(notas);
  const byIsl=ISL.map((x,i)=>{const v=st.map(s=>islaNota(s,i).v).filter(v=>v!=null);return{...x,v:avg(v),cnt:v.length}});
  const bands=[['Superior','#13998b',n=>n>=4.6],['Alto','#7cc9a0',n=>n>=4&&n<4.6],['Básico','#f2b01e',n=>n>=3&&n<4],['Bajo','#e9456f',n=>n<3]].map(([l,c,fn])=>({l,c,n:notas.filter(fn).length}));
  const sin=st.length-notas.length;
  const need=st.map(s=>{const n=finalNota(s),c=counts(s),r=[];if(n==null)r.push('No ha jugado');else{if(n<C().scale.alert)r.push('Nota '+f1(n));if(c.t&&c.a/c.t>.25)r.push(pct(c.a/c.t)+' con ayuda')}if(last(s)&&NOW-last(s)>7*DAY)r.push('Sin jugar hace más de una semana');return{s,r}}).filter(x=>x.r.length).slice(0,8);
  const recent=st.flatMap(s=>s.retos.map(r=>({s,r}))).sort((a,b)=>b.r.t-a.r.t).slice(0,7);
  return `<div class="kpis"><div class="kpi c1"><b>${f1(prom)}</b><span>Nota promedio</span></div><div class="kpi c2"><b>${week.length} de ${st.length}</b><span>Jugaron esta semana</span></div>
  <div class="kpi c3"><b>${pct(all.p/all.t)}</b><span>Respuestas a la primera</span></div><div class="kpi c4"><b>${pct(all.a/all.t)}</b><span>Usaron la ayuda de Numi</span></div></div>
  <div class="grid g2"><section class="card"><h3>Nota promedio por isla</h3><p class="muted" style="font-size:14px;margin:-4px 0 var(--s2)">La más baja es la que más hay que reforzar.</p>
  <div class="rows">${byIsl.map(x=>`<div class="hrow"><span>${x.n}</span><span class="track"><i style="--c:${x.c};width:${x.v?x.v/5*100:0}%"></i></span><em>${f1(x.v)}</em></div>`).join('')}</div></section>
  <section class="card"><h3>Desempeño del salón</h3><div class="stackbar">${bands.map(b=>`<i style="background:${b.c};width:${b.n/st.length*100}%"></i>`).join('')}<i style="background:var(--line);width:${sin/st.length*100}%"></i></div>
  <div class="legend">${bands.map(b=>`<span><i style="background:${b.c}"></i>${b.l}: ${b.n}</span>`).join('')}<span><i style="background:var(--line)"></i>Sin nota: ${sin}</span></div>
  <p class="muted" style="font-size:14px;margin-top:var(--s2)">Niveles de desempeño: Superior 4,6–5,0 · Alto 4,0–4,5 · Básico 3,5–3,9 · Bajo menos de 3,5.</p></section>
  <section class="card"><h3>Necesitan apoyo</h3>${need.length?need.map(({s,r})=>`<button class="alert" data-a="stu" data-id="${s.id}"><i class="av" style="background:var(--gold);color:#2b1d3a">${s.name[0]}</i><div><b>${esc(s.name)}</b><small>${r.join(' · ')}</small></div><span class="link">Ver</span></button>`).join(''):'<p class="muted">¡Todas van bien!</p>'}</section>
  <section class="card"><h3>Actividad reciente</h3>${recent.map(({s,r})=>{const n=retoNota(r);return `<button class="alert" data-a="stu" data-id="${s.id}"><i class="av" style="background:${ISL[r.isl].c}">${s.name[0]}</i><div><b>${esc(s.name)}</b><small>${ISL[r.isl].n} · Nivel ${r.lvl+1} · ${ago(r.t)}</small></div><span class="nota">${f1(n)}</span></button>`}).join('')}</section></div>`;
}

/* estudiantes */
function estudiantes(){
  let st=C().students.filter(s=>slug(s.name).includes(slug(V.q)));
  const sorters={name:(a,b)=>a.name.localeCompare(b.name,'es'),nota:(a,b)=>(finalNota(a)??-1)-(finalNota(b)??-1),notaD:(a,b)=>(finalNota(b)??-1)-(finalNota(a)??-1),last:(a,b)=>(last(b)||0)-(last(a)||0)};
  st=[...st].sort(sorters[V.sort]);
  return `<div class="tools"><input id="q" placeholder="Buscar estudiante" value="${esc(V.q)}" aria-label="Buscar estudiante"><select id="sort" aria-label="Ordenar">
  ${[['name','Orden alfabético'],['notaD','Nota: mayor a menor'],['nota','Nota: menor a mayor'],['last','Último ingreso']].map(([k,n])=>`<option value="${k}" ${V.sort==k?'selected':''}>${n}</option>`).join('')}</select></div>
  ${st.some(x=>x.retos.length)?`<div class="legend-mini"><span><i style="background:var(--teal)"></i>A la primera</span><span><i style="background:var(--gold)"></i>Con error</span><span><i style="background:var(--coral)"></i>Con ayuda</span></div>`:''}
  <div class="slist">${st.map(s=>{const c=counts(s),n=finalNota(s),d=desemp(n),l=last(s);
    const bar=c.t?`<span class="sc-bar" aria-label="${pct(c.p/c.t)} a la primera, ${pct((c.s+c.m)/c.t)} con error, ${pct(c.a/c.t)} con ayuda"><i style="width:${c.p/c.t*100}%;background:var(--teal)"></i><i style="width:${(c.s+c.m)/c.t*100}%;background:var(--gold)"></i><i style="width:${c.a/c.t*100}%;background:var(--coral)"></i></span>`:'';
    return `<div class="scard"><button class="scard-main" data-a="stu" data-id="${s.id}"><i class="av sc-av">${ini(s.name)}</i><span class="sc-txt"><b>${esc(s.name)}</b><small>${l?`${ago(l)} · ${s.retos.length} ${s.retos.length==1?'reto':'retos'}`:'Todavía no ha jugado'}</small>${bar}</span><span class="sc-nota">${n!=null?`<b>${f1(n)}</b><span class="pill ${d[1]}">${d[0]}</span>`:'<span class="pill p-n">Sin nota</span>'}</span></button><button class="dots" data-a="stumenu" data-id="${s.id}" aria-label="Opciones de ${esc(s.name)}">⋮</button></div>`}).join('')}</div>
  ${st.length?'<p class="muted" style="font-size:14px;margin-top:var(--s2)">Toca a una estudiante para ver sus notas. Con los tres puntitos <b>⋮</b> puedes cambiar su clave o eliminarla si se retiró.</p>':''}
  ${st.length?'':'<p class="muted" style="margin-top:var(--s3)">No hay estudiantes con ese nombre.</p>'}`;
}

/* detalle de estudiante */
function student(){
  const s=C().students.find(x=>x.id==V.student),c=counts(s),n=finalNota(s),d=desemp(n);
  return `<button class="back" data-a="tabback">‹ ${C().name} · Estudiantes</button>
  <div class="head"><div><h1>${esc(s.name)}</h1><p class="muted">Usuario: <b>${s.user}</b> · ${C().name} · Último ingreso: ${ago(last(s))}</p></div><span class="pill ${d[1]}" style="font-size:16px;padding:6px 14px">${d[0]} · ${f1(n)}</span></div>
  <div class="kpis"><div class="kpi c1"><b>${f1(n)}</b><span>Nota final</span></div><div class="kpi c2"><b>${c.t?pct(c.p/c.t):'—'}</b><span>A la primera</span></div>
  <div class="kpi c3"><b>${s.retos.length}</b><span>Retos jugados</span></div><div class="kpi c4"><b>${c.t?pct(c.a/c.t):'—'}</b><span>Con ayuda de Numi</span></div></div>

// Descarga un archivo de Excel (.xlsx) de verdad; si no carga la librería, baja un CSV que Excel también abre
async function downloadExcel(rows,file,sheetName){
  try{
    if(!window.XLSX)await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((h,i)=>({wch:Math.max(String(h).length,...rows.map(r=>String(r[i]??'').length))+2}));
    rows.forEach((r,y)=>r.forEach((v,x)=>{if(typeof v=='number'){const c=ws[XLSX.utils.encode_cell({r:y,c:x})];if(c)c.z='0.0'}}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheetName.slice(0,31));XLSX.writeFile(wb,file+'.xlsx');
  }catch(e){const blob=new Blob(['\ufeff'+rows.map(r=>r.map(x=>`"${String(x??'').replace('.',',').replace(/"/g,'""')}"`).join(';')).join('\n')],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=file+'.csv';l.click()}
  toast('Listo: el archivo quedó en Descargas. Ábrelo con Excel o Google Sheets.');
}
const n1=v=>v==null?'':Math.round(v*10)/10;
function planillaRows(){const rows=[['Estudiante',...ISL.map(x=>x.n),'Nota final','Desempeño']];C().students.forEach(s=>{const n=finalNota(s);rows.push([s.name,...ISL.map((_,i)=>n1(islaNota(s,i).v)),n1(n),desemp(n)[0]])});return rows}
function consolidadoRows(){const rows=[['Curso','Profesor','Estudiante',...ISL.map(x=>x.n),'Nota final','Desempeño']];sortedCls().forEach(c=>c.students.forEach(s=>{const n=finalNota(s);rows.push([c.name,teachersOf(c.id).join(' / '),s.name,...ISL.map((_,i)=>n1(islaNota(s,i).v)),n1(n),desemp(n)[0]])}));return rows}
function copyPlanilla(){
  const st=C().students,rows=[['Estudiante',...ISL.map(x=>x.n),'Final','Desempeño']];
  st.forEach(s=>{const n=finalNota(s);rows.push([s.name,...ISL.map((_,i)=>{const v=islaNota(s,i).v;return v==null?'':v.toFixed(1).replace('.',',')}),n==null?'':n.toFixed(1).replace('.',','),desemp(n)[0]])});
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>toast('Tabla copiada. Abre Excel, toca la primera casilla y pega.'),()=>toast('No se pudo copiar. Usa mejor "Descargar en Excel".'));
}

// src: nombre de un recorrido o lista de pasos. back: al terminar vuelve a donde estaba
function tour(src,back=typeof src=='string'){
  const steps=typeof src=='string'?TOURS[src]():src;if(typeof src=='string')tourMark(src);
  TOURON=true;let i=-1,shown=0;const from={screen:V.screen,tab:V.tab,student:V.student};
  const blk=document.createElement('div');blk.className='tour-block';const tip=document.createElement('div');tip.className='card tour-tip';tip.setAttribute('role','dialog');tip.setAttribute('aria-live','polite');
  const hand=document.createElement('div');hand.className='tour-hand';hand.textContent='👆';hand.setAttribute('aria-hidden','true');document.body.append(blk,tip,hand);
  const clear=()=>$$('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
  const end=()=>{clear();blk.remove();tip.remove();hand.remove();removeEventListener('resize',place);TOURON=false;
    if(back&&(V.screen!=from.screen||V.tab!=from.tab)){Object.assign(V,from);render();scrollTo(0,0)}};
  let cur=null;
  function place(){if(!cur||!cur.isConnected){hand.style.display='none';return}const r=cur.getBoundingClientRect();
    hand.style.display='block';hand.style.left=Math.min(innerWidth-48,Math.max(4,r.left+Math.min(r.width/2,90)-16))+'px';hand.style.top=Math.min(innerHeight-60,r.bottom-8)+'px';
    tip.classList.toggle('up',r.top+r.height/2>innerHeight*.5)}
  function go(){
    i++;if(i>=steps.length)return end();const st=steps[i];
    if(st.atab&&(V.screen!='home'||V.atab!=st.atab)){V.screen='home';V.atab=st.atab;render()}
    if(st.tab&&C()&&(V.screen!='salon'||V.tab!=st.tab)){V.screen='salon';V.tab=st.tab;V.ocr=null;render()}
    if(st.student&&C()){const s0=C().students[0];if(s0&&(V.screen!='student'||V.student!=s0.id)){V.screen='student';V.student=s0.id;V.tab='estudiantes';render()}}
    const el=st.sel?$(st.sel):null;
    if(st.sel&&!el&&!st.alt)return go();
    shown++;clear();cur=el;
    if(el){el.classList.add('tour-hl');el.scrollIntoView({block:'center'})}else scrollTo(0,0);
    blk.style.background=el?'transparent':'rgb(23 19 42/.6)';
    tip.innerHTML=`<div class="tn">${NUMI}<div><b style="font-family:Fredoka,sans-serif;font-size:19px">${st.t}</b><div class="muted" style="font-size:13px">Paso ${i+1} de ${steps.length}</div></div></div><p style="margin:0">${el||!st.alt?st.d:st.alt}</p><div class="tools" style="margin:4px 0 0"><button class="btn" data-k="next">${i>=steps.length-1?'¡Entendido!':'Siguiente'}</button>${i>0?'<button class="btn ghost" data-k="prev">Atrás</button>':''}${i<steps.length-1?'<button class="btn ghost" data-k="skip">Salir del recorrido</button>':''}</div>`;
    requestAnimationFrame(place);tip.querySelector('[data-k=next]').focus();
  }
  tip.addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(k=='next')go();else if(k=='prev'){i=Math.max(-1,i-2);go()}else if(k=='skip')end()});
  addEventListener('resize',place);go();
}

function parseNames(text){
  const bad=/^(lista|grado|curso|nombre|nombres|apellidos|n[°ºo.]|no\.?|docente|profesor|institucion|colegio|periodo|año|fecha|asignatura)/i;

    .filter(l=>l.length>=5&&l.split(' ').length>=2&&/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü ]+$/.test(l)&&!bad.test(l))
    .map(l=>l.split(' ').filter(w=>w.length>2||/^(de|la|y|da|do)$/i.test(w)).join(' '))

/* las fotos del celular son enormes: se reducen antes de leerlas para no colgar el navegador */
async function shrink(file,max=2000){
  try{
    const img=await new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=e=>{URL.revokeObjectURL(u);ko(e)};im.src=u});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    const g=cv.getContext('2d');g.filter='grayscale(1) contrast(1.3)';g.drawImage(img,0,0,cv.width,cv.height);
    return cv;
  }catch(e){return file}
}
const toBlob=cv=>cv instanceof Blob?Promise.resolve(cv):new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
function threshold(cv){try{const g=cv.getContext('2d'),d=g.getImageData(0,0,cv.width,cv.height),px=d.data,h=new Array(256).fill(0);
  for(let i=0;i<px.length;i+=4)h[px[i]]++;let tot=px.length/4,sum=0;for(let t=0;t<256;t++)sum+=t*h[t];let sB=0,wB=0,best=0,th=128;
  for(let t=0;t<256;t++){wB+=h[t];if(!wB)continue;const wF=tot-wB;if(!wF)break;sB+=t*h[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>best){best=v;th=t}}
  for(let i=0;i<px.length;i+=4){const v=px[i]>th?255:0;px[i]=px[i+1]=px[i+2]=v}g.putImageData(d,0,0)}catch(e){}return cv}
// Explica en palabras simples por qué no respondió Gemini (y deja el detalle técnico para revisarlo)
function aiWhy(e){const m=String(e&&(e.message||e.code)||e||'');
  const why=/App Check|reCAPTCHA/i.test(m)?'Falta terminar la protección App Check de Firebase.'
    :/api.?key|API_KEY|blocked|are blocked|referer/i.test(m)?'La clave de la app no tiene permiso para usar la IA.'
    :/quota|RESOURCE_EXHAUSTED|429/i.test(m)?'Se acabó el cupo gratuito de la IA por ahora.'
    :/has not been used|disabled|SERVICE_DISABLED|not enabled|PERMISSION_DENIED|403/i.test(m)?'La IA no está activada del todo en Firebase.'
    :/location|region|not available in your country|FAILED_PRECONDITION/i.test(m)?'La IA gratuita no está disponible en esta región.'
    :/network|Failed to fetch|import|dynamically imported/i.test(m)?'No se pudo conectar con la IA.'
    :'La IA respondió con un error.';
  return why+' Detalle: '+m.slice(0,240)}

async function runOCR(file){
  V.ocr='loading';V.aiErr='';render();
  // 1) Lectura con IA (Gemini en Firebase). Si no está activada, se usa el lector básico.
  try{
    const blob=await toBlob(await shrink(file,1600));
    const names=await DB.readNameList(blob);
    if(names.length){V.ocr=uniqUsers(names.map(mkUser));render();toast(`Leí ${names.length} nombres. Revísalos antes de crear los usuarios.`);return}
  }catch(e){console.warn('IA no disponible, uso el lector básico:',aiWhy(e));V.aiErr=true}
  // 2) Lector básico (Tesseract) con la foto en blanco y negro
  try{
    const cv=threshold(await shrink(file,2400));
    if(!window.Tesseract)await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=ko;document.head.appendChild(sc)});
    const r=await Tesseract.recognize(cv,'spa');
    const names=parseNames(r.data.text);
    if(!names.length){V.ocr=null;render();toast('No pude leer nombres en la foto. Prueba con más luz o escribe la lista.');return}
    V.ocr=uniqUsers(names.map(mkUser));render();toast('Revisa bien los nombres. Si la lista está como "Apellidos Nombres", toca "voltear".');
  }catch(e){V.ocr=null;render();toast('No se pudo leer la foto. Puedes escribir o pegar la lista.')}
}
async function saveStudents(){
  const c=C(),rows=V.ocr.filter(r=>r.name.trim().split(' ').length>=1&&r.name.trim());
  V.ocr={saving:true,done:0,total:rows.length};render();
  const made=[];let errors=0;
  for(const r of rows){try{const st=await DB.createStudent(c.id,c.year,{name:r.name.trim(),user:r.user,pics:r.pics});made.push({...st,retos:[]})}catch(e){errors++;console.error(e);if(e.code=='permission-denied'){fail(e);break}}V.ocr.done++;render()}
  c.students.push(...made);c.students.sort(byName);V.ocr=null;render();
  toast(errors?`Se crearon ${made.length} usuarios. ${errors} no se pudieron crear.`:`¡Listo! Se crearon ${made.length} usuarios. Ya puedes imprimir las tarjetas.`);
}

// Pone los apellidos al final: «Ramos Chacon Dulce Maria» → «Dulce Maria Ramos Chacon»
function flipName(n){const w=String(n).trim().split(/\s+/);const k=w.length>=3?2:1;return [...w.slice(k),...w.slice(0,k)].join(' ')}
// Motivo por el que un nombre leído parece raro (o '' si se ve bien)
function doubt(name,k){const n=String(name||'').trim(),w=n.split(/\s+/).filter(Boolean);
  if(!n||n=='Nueva Estudiante')return 'Escribe el nombre completo';
  if(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü' -]/.test(n))return 'Tiene números o símbolos';
  if(w.some(x=>x.length<=2&&!/^(de|la|y|da|do)$/i.test(x)))return 'Tiene letras sueltas';
  if(w.length<3)return '¿Le falta un nombre o un apellido?';
  if(w.length>6)return 'Parecen dos nombres juntos';
  const sl=slug(n);if(Array.isArray(V.ocr)&&V.ocr.some((r,j)=>j!=k&&slug(r.name)==sl))return 'Está repetido en la lista';
  if(C()&&C().students.some(s=>slug(s.name)==sl))return 'Ya tiene usuario en este curso';
  return ''}
// Ejecuta una acción del panel como si se tocara su botón
function fire(a,id){const t=document.createElement('button');t.dataset.a=a;if(id)t.dataset.id=id;t.hidden=true;document.body.appendChild(t);t.click();setTimeout(()=>t.remove(),0)}
function mkUser(name){const PART=/^(de|del|la|las|los|y|da|do|dos|van|von)$/i;const p=name.trim().split(/\s+/).filter((w,i)=>i==0||!PART.test(w));return{name:name.trim(),user:slug(p[0])+'.'+slug(p[p.length>2?p.length-2:p.length-1]||'').slice(0,3),pics:[0,1,2].map(()=>PICS[Math.floor(Math.random()*6)])}}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id=='q'){V.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  else if(t.id=='obs'){const sid=t.dataset.id;D.notes[sid]=t.value;later('obs'+sid,()=>noteSave(sid),900)}
  else if(t.dataset.ocr!=null){const k=+t.dataset.ocr;V.ocr[k]={...mkUser(t.value),pics:V.ocr[k].pics};const row=t.closest('.orow'),why=doubt(t.value,k);row.querySelector('code').textContent=V.ocr[k].user;row.classList.toggle('doubt',!!why);row.querySelector('.why').textContent=why?'⚠ '+why:''}
  else if(t.dataset.sc){const v=parseFloat(t.value.replace(',','.'));if(!V.scd)V.scd={...C().scale};if(v>=1&&v<=5){V.scd[t.dataset.sc]=Math.round(v*10)/10;t.classList.remove('bad')}else t.classList.add('bad');scRefresh()}
});

});

/* ojito para ver la contraseña mientras se escribe */
{const EYE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const eyes=()=>document.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{
  i.dataset.eye=1;const w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);
  const b=document.createElement('button');b.type='button';b.className='eye';b.setAttribute('aria-label','Mostrar contraseña');b.innerHTML=EYE;
  b.addEventListener('click',()=>{const show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:EYE;b.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');i.focus()});
  w.appendChild(b)});
eyes();new MutationObserver(eyes).observe(document.body,{childList:true,subtree:true});}
/* arranque */
render();
(async()=>{
  DB=await new Promise(r=>{if(window.NumiDB)return r(window.NumiDB);if(window.NUMIDB_FAIL)return r(null);const t=setTimeout(()=>r(null),8000);addEventListener('numidb',()=>{clearTimeout(t);r(window.NumiDB)},{once:true});addEventListener('numidbfail',()=>{clearTimeout(t);r(null)},{once:true})});
  if(!DB){V.screen='nodb';return render()}
  V.setupDone=await DB.setupDone();
  const off=DB.onAuth(u=>{off();if(u)afterAuth();else{V.screen='login';render()}});
})();
render();
}
</script>
