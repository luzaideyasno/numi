<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numi — retos de mate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: alegre, cálida y paciente, como una amiga que juega contigo
   IDEA: un reino de islas que se recorre resolviendo retos, con una unicornia que se viste con lo que ganas
   PICTURE: el mapa del mar con islas y Numi parada en la isla donde vas
   COLOUR and TYPE: mar turquesa claro, islas de colores con arena dorada, coral para acciones; Fredoka redondeada
   LAYOUT: una columna de máx. 640px, espacios generosos, botones grandes para dedos pequeños */
:root{color-scheme:light dark;
--bg:light-dark(#fff8ee,#1b1530);--ink:light-dark(#2b1d3a,#f7efff);--card:light-dark(#fff,#2a2145);
--soft:light-dark(#ffeef2,#3d2d58);--line:light-dark(#f0dbe1,#4a3a6a);--muted:light-dark(#76668a,#c4b4d6);
--sun:light-dark(#ffc93c,#3b2d63);--sea:light-dark(#c4eee6,#13304a);--sea2:light-dark(#a9e4d9,#0f2840);
--coral:#e9456f;--teal:#13998b;--gold:#ffc93c;--bad:light-dark(#ffe0e7,#5a2338);
--s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--r:22px;
--cw:clamp(38px,11.5vw,54px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Fredoka,ui-rounded,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:0 max(5vw,18px)}
p{margin:0}
h1{font-size:clamp(36px,8vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(26px,6vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.link{color:var(--coral);font-weight:600;text-decoration:underline;min-height:44px;padding:0 4px}
/* encabezado */
.top{display:flex;align-items:center;gap:var(--s1);padding:var(--s2) max(4vw,14px);max-width:680px;margin:0 auto}
.logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:23px;min-height:48px;margin-right:auto}
.logo .nm{width:46px;display:block}
.tot{font-weight:700;font-size:19px;background:var(--card);border:3px solid var(--gold);border-radius:99px;padding:5px 12px;white-space:nowrap}
.tot b{color:#e0a21c}.tot.pulse{animation:pulse .7s}
@keyframes pulse{40%{transform:scale(1.25);background:var(--gold)}}
.ibtn{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.ibtn svg{width:24px;height:24px}
/* portada */
.hero{background:var(--sun);padding:var(--s5) 0 var(--s6)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:var(--s4)}
.numi-big{width:100%;max-width:280px;justify-self:center;animation:bob 3s ease-in-out infinite}
.numi-big svg{width:100%;height:auto;display:block}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.hero h1{margin-bottom:var(--s2)}.lead{font-size:20px}
.panel{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:var(--s4);margin:calc(var(--s5)*-1) auto var(--s6);position:relative;box-shadow:0 8px 0 var(--line)}
label,.lab{display:block;font-weight:600;font-size:20px;margin:0 0 var(--s2)}
.field+.field{margin-top:var(--s4)}
input{width:100%;font:inherit;font-size:20px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:var(--s2)}
.chip{min-height:64px;border-radius:18px;font-size:24px;font-weight:700;background:var(--bg);border:3px solid var(--line);padding:6px}
.chip.txt{font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 5px 0 #b72f53}
.big-btn{display:block;width:100%;margin-top:var(--s4);min-height:64px;border-radius:20px;background:var(--coral);color:#fff;font-size:23px;font-weight:700;box-shadow:0 6px 0 #b72f53;padding:8px 16px}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b72f53}
.big-btn.alt{background:var(--teal);box-shadow:0 6px 0 #0b6c62}
.big-btn.gold{background:var(--gold);color:#2b1d3a;box-shadow:0 6px 0 #d99f12}
/* mapa */
.sea{background:var(--sea);padding:var(--s4) 0 var(--s4);background-image:radial-gradient(circle at 20% 30%,var(--sea2) 0 40px,transparent 41px),radial-gradient(circle at 85% 60%,var(--sea2) 0 60px,transparent 61px);background-size:100% 520px}
.maptop{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
.learned{background:var(--card);border-radius:18px;padding:8px 14px;font-weight:600;font-size:16px}
.learned b{color:var(--coral);font-size:20px}
.map{position:relative;max-width:520px;margin:0 auto}
.path{position:absolute;inset:0;width:100%;height:100%}
.path path{fill:none;stroke:light-dark(#fff,#4f7a96);stroke-width:7;stroke-linecap:round;stroke-dasharray:1 16;vector-effect:non-scaling-stroke}
.isle{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;width:140px}
.blob{width:108px;height:94px;border-radius:52% 48% 46% 54%/56% 50% 50% 44%;background:var(--c);border:7px solid #ffe2a1;box-shadow:0 9px 0 rgb(0 0 0/.13);display:grid;place-items:center;position:relative;color:#fff;font-size:46px;font-weight:700}
.isle b{background:var(--card);border-radius:99px;padding:3px 14px;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 rgb(0 0 0/.08)}
.pips{display:flex;gap:5px}
.pips i{width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.pips i.on{background:var(--gold);border-color:#d99f12}
.isle.lock .blob{background:#b9b2c4;color:#fff}
.isle.lock b{color:var(--muted)}
.isle.cur .blob{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 9px 0 rgb(0 0 0/.13),0 0 0 10px rgb(255 255 255/.55)}}
.crown{position:absolute;top:-30px;width:44px;height:34px}
.lockic{width:40px;height:40px}
.avatar{position:absolute;width:92px;transform:translate(-50%,-70%);pointer-events:none;animation:bob 3s ease-in-out infinite}
.avatar svg{width:100%;height:auto;display:block}
/* páginas */
.page{padding-block:var(--s4) var(--s6)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;font-weight:600;color:var(--muted);margin-bottom:var(--s2)}
.back svg{width:24px;height:24px}
.ihead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4)}
.ihead .blob{width:84px;height:74px;font-size:36px;border-width:6px;flex:none}
.levels{display:grid;gap:var(--s3)}
.lvl{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:var(--s3);text-align:left;width:100%}
.lvl .n{width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
.lvl div{flex:1}.lvl b{font-size:20px;display:block}.lvl small{color:var(--muted);font-size:15px}
.lvl em{font-style:normal;font-weight:700;color:#e0a21c;white-space:nowrap}
.lvl.lock{opacity:.55;cursor:default}.lvl.lock .n{background:#b9b2c4}
.note{background:var(--soft);border-radius:18px;padding:var(--s3);margin-top:var(--s4);font-size:17px}
/* mapa ilustrado */
.sea{background:linear-gradient(180deg,var(--sea),var(--sea2));padding:var(--s4) 0 0}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dec{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.dec.cloud{width:110px;opacity:.9;animation:drift 9s ease-in-out infinite}.dec.c2{width:90px;animation-delay:-4s}
.dec.boat{width:62px;animation:rock 3.5s ease-in-out infinite}
.dec.fish{width:38px;animation:jump 4s ease-in-out infinite}.dec.f2{animation-delay:-2s;transform:translate(-50%,-50%) scaleX(-1)}
@keyframes drift{50%{margin-left:14px}}
@keyframes rock{50%{transform:translate(-50%,-50%) rotate(6deg)}}
@keyframes jump{0%,70%,100%{margin-top:0}80%{margin-top:-18px}}
.isle{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;width:min(46vw,190px);transition:transform .15s}
.isle:active{transform:translate(-50%,-50%) scale(.96)}
.isle .art{display:block;width:100%}.isle .art svg{display:block;width:100%;height:auto;overflow:visible}
.isle.cur .art{animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sign{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;font-weight:700;font-size:16px;border-radius:99px;padding:4px 14px 4px 5px;margin-top:-10px;white-space:nowrap;box-shadow:0 4px 0 rgb(0 0 0/.18)}
.sign i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-size:18px;line-height:1}
.isle.lock .sign{background:#a49cb3}.isle.lock .sign i{color:#a49cb3}
.isle.cur .sign{outline:3px solid #fff}
.path path{stroke:light-dark(#fff8e1,#4f7a96);stroke-width:8;stroke-dasharray:2 18}
/* tutorial */
.tour{position:fixed;inset:0;z-index:40}
.dim{position:absolute;inset:0;background:rgb(27 21 48/.62)}
.spot{position:absolute;border-radius:22px;box-shadow:0 0 0 9999px rgb(27 21 48/.62);outline:4px solid var(--gold);outline-offset:2px;animation:in .25s}
.tcard{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,460px);background:var(--card);border-radius:26px;padding:var(--s3);display:flex;gap:var(--s2);align-items:flex-start;box-shadow:0 12px 30px rgb(0 0 0/.3);animation:in .3s}
.tcard.center{top:50%;transform:translate(-50%,-50%)}.tcard.top{top:max(16px,env(safe-area-inset-top))}.tcard.bottom{bottom:20px}
.tcard .nm{width:72px;flex:none}
.tbody{flex:1}.tbody p{font-size:19px;line-height:1.35;font-weight:500}
.trow{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.tskip{min-height:44px;padding:0 10px;color:var(--muted);font-weight:600;font-size:16px}
.tdots{display:flex;gap:5px;flex:1;justify-content:center}.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tdots i.on{background:var(--coral);width:20px;border-radius:9px}
.tnext{min-height:48px;padding:0 18px;border-radius:16px;background:var(--coral);color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 0 #b72f53}
/* celebración */
.cheer{font-size:22px;font-weight:700;color:var(--teal);margin:0 0 var(--s2);animation:pop .6s}
/* salir y continuar */
.exit{min-height:44px;padding:0 14px;border-radius:99px;border:3px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.modal{position:fixed;inset:0;background:rgb(27 21 48/.55);display:grid;place-items:center;padding:20px;z-index:30;animation:in .2s}
.sheet{background:var(--card);border-radius:28px;padding:var(--s4);max-width:420px;width:100%;text-align:center}
.sheet .nm{width:96px;display:block;margin:0 auto var(--s2)}
.sheet h3{font-size:24px;margin:0 0 var(--s1)}
.resume{display:flex;align-items:center;gap:var(--s2);background:var(--card);border:3px solid var(--c);border-radius:22px;padding:var(--s2) var(--s3);margin-bottom:var(--s4);box-shadow:0 6px 0 rgb(0 0 0/.08)}
.resume .blob{width:54px;height:48px;font-size:24px;border-width:4px;flex:none}
.resume div{flex:1}.resume b{display:block;font-size:18px}.resume small{color:var(--muted);font-size:15px}
.resume .next{padding:0 18px;min-height:52px;font-size:18px}
@media(max-width:420px){.resume{flex-wrap:wrap}.resume .next{width:100%}}
/* armario */
.closet{display:grid;gap:var(--s4)}
.stage{background:var(--sun);border-radius:28px;padding:var(--s4);display:grid;justify-items:center;gap:var(--s2)}
.stage .numi-big{max-width:220px}
.wallet{font-weight:700;font-size:20px;background:var(--card);border-radius:99px;padding:4px 16px}
.wallet b{color:#e0a21c}
.shelf h3{font-size:21px;margin:0 0 var(--s2)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--s2)}
.item{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 6px 10px;display:grid;justify-items:center;gap:2px}
.item svg{width:72px;height:68px}
.item b{font-size:15px;line-height:1.15}
.item small{font-size:14px;font-weight:700;color:#e0a21c}
.item.own small{color:var(--teal)}
.item.on{border-color:var(--coral);background:var(--soft)}
.item.on small{color:var(--coral)}
.item.poor{opacity:.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:18px;font-weight:600;z-index:20;max-width:90vw;text-align:center;animation:in .3s}
/* juego */
.play{padding-block:var(--s2) var(--s6)}
.prog{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.prog .dots5{display:flex;gap:6px;flex:1}
.prog i{flex:1;height:12px;border-radius:9px;background:var(--line)}
.prog i.d{background:var(--teal)}.prog i.c{background:var(--coral)}
.tag{background:var(--c);color:#fff;border-radius:99px;padding:3px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.ask{display:flex;align-items:flex-start;gap:var(--s2);margin-bottom:var(--s4)}
.ask>.nm{width:86px;flex:none;animation:bob 3s ease-in-out infinite}
.nm svg{width:100%;height:auto;display:block}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:var(--s3);font-size:20px;line-height:1.4;position:relative;flex:1}
.bubble::before{content:"";position:absolute;left:-12px;top:26px;border:9px solid transparent;border-right-color:var(--line)}
.listen{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s2);min-height:44px;padding:0 14px;border-radius:99px;background:var(--soft);font-size:16px;font-weight:600}
.listen svg{width:20px;height:20px}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:var(--s4) var(--s3);box-shadow:0 8px 0 var(--line)}
.hint{font-size:15px;color:var(--muted);text-align:center;margin-top:var(--s3)}
.colop{display:grid;justify-content:center;row-gap:6px;font-variant-numeric:tabular-nums}
.cell{display:grid;place-items:center;min-height:calc(var(--cw)*1.05);font-size:calc(var(--cw)*.74);font-weight:600}
.cell.pl{min-height:20px;font-size:13px;color:var(--muted);font-weight:700}
.cell.cr{min-height:calc(var(--cw)*.8)}
.op{color:var(--coral);font-weight:700}
.line{border-top:4px solid var(--ink);border-radius:4px;margin:2px 0 4px}
.box{width:calc(var(--cw) - 6px);height:calc(var(--cw)*1.15);border:3px dashed var(--teal);border-radius:14px;background:var(--bg);font-size:calc(var(--cw)*.62);font-weight:700;display:grid;place-items:center;padding:0}
.box.sm{height:calc(var(--cw)*.72);width:calc(var(--cw)*.78);font-size:16px;border-width:2px;border-color:var(--muted);border-radius:10px}
.box.sel{border-style:solid;border-color:var(--coral);box-shadow:0 0 0 4px rgb(233 69 111/.22)}
.box.bad{background:var(--bad);border:3px solid var(--coral);animation:shake .35s}
.box.good{background:var(--teal);border:3px solid var(--teal);color:#fff;animation:pop .4s}
.lineop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:var(--s2);font-size:clamp(30px,8vw,44px);font-weight:700;font-variant-numeric:tabular-nums}
.lineop .boxes{display:flex;gap:6px}
.unit{font-size:20px;font-weight:600}
.fbox{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fbox i{width:calc(var(--cw)*1.2);border-top:4px solid var(--ink);border-radius:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-weight:700}
.fr b:first-child{border-bottom:.08em solid currentColor;padding:0 .15em .05em}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s4)}
.pad button{min-height:60px;border-radius:18px;background:var(--card);border:3px solid var(--line);font-size:28px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .del{font-size:18px;background:var(--soft)}
.pad .chk{font-size:18px;background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 0 #0b6c62}
.eq{font-size:clamp(34px,8vw,50px);font-weight:700;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-top:var(--s4)}
.opt{min-height:80px;border-radius:20px;background:var(--soft);border:3px solid var(--line);font-size:clamp(24px,6vw,30px);font-weight:700;font-variant-numeric:tabular-nums}
.opt.ok{background:var(--teal);border-color:var(--teal);color:#fff;animation:pop .4s}
.opt.no{opacity:.45;text-decoration:line-through;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;align-items:center;gap:var(--s2);margin-top:var(--s4);padding:var(--s3);border-radius:20px;background:var(--soft);font-size:19px;font-weight:600}
.fb.on{display:flex}.fb .nm{width:60px;flex:none}
.fb.win{background:light-dark(#dff6f2,#1f4a45)}
.acts{display:grid;gap:var(--s2);margin-top:var(--s4)}
.help-btn{min-height:56px;border-radius:18px;background:var(--gold);color:#2b1d3a;font-weight:700;font-size:19px;box-shadow:0 5px 0 #d99f12}
.next{min-height:60px;border-radius:18px;background:var(--coral);color:#fff;font-weight:700;font-size:21px;box-shadow:0 5px 0 #b72f53}
.help{margin-top:var(--s5);background:var(--soft);border-radius:28px;padding:var(--s4) var(--s3);border:3px dashed var(--coral)}
.help h3{margin:0 0 var(--s3);font-size:22px;display:flex;align-items:center;gap:var(--s2)}
.help h3 .nm{width:48px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:var(--s3);counter-reset:s}
.steps li{background:var(--card);border-radius:18px;padding:var(--s3) var(--s3) var(--s3) 58px;position:relative;font-size:18px;animation:in .35s}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.vis{margin-top:var(--s2);overflow-x:auto}
.cg{display:inline-grid;font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.25}
.cg span{text-align:center;min-height:1.25em}.cg span.hi{background:light-dark(#fff1c2,#4b3b2a);border-radius:8px}
.cg small{font-size:15px;color:var(--coral);font-weight:700}
.cg i{border-top:3px solid var(--ink);margin:2px 0}
.dots{display:flex;flex-wrap:wrap;gap:var(--s1)}
.grp{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:2px dashed var(--coral);border-radius:12px;max-width:92px}
.grp i{width:13px;height:13px;border-radius:50%;background:var(--teal)}
.bar{display:grid;grid-template-columns:repeat(var(--d),minmax(0,1fr));gap:4px;height:42px;max-width:360px;margin:var(--s1) auto}
.bar span{background:var(--bg);border:2.5px solid var(--line);border-radius:8px}
.bar span.on{background:var(--coral);border-color:var(--coral)}.bar span.on2{background:var(--teal);border-color:var(--teal)}
.after{margin:var(--s3) 0 0;font-weight:600}
/* final */
.done{text-align:center;padding-block:var(--s4) var(--s6)}
.done .numi-big{max-width:190px}
.score{font-size:clamp(44px,11vw,64px);font-weight:700;color:var(--coral);margin:var(--s2) 0}
.medals{display:flex;justify-content:center;gap:var(--s1);flex-wrap:wrap;margin:var(--s4) 0 var(--s2)}
.medal{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 10px;font-size:20px;color:#e0a21c;letter-spacing:1px}
.medal .e{color:var(--line)}
.prize{background:var(--sun);border-radius:22px;padding:var(--s3);margin-top:var(--s4);font-weight:600;font-size:19px;display:flex;align-items:center;gap:var(--s2);text-align:left}
.prize svg{width:48px;height:38px;flex:none}
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:9}
.plus{position:fixed;font-size:30px;font-weight:700;color:#e0a21c;pointer-events:none;z-index:10;animation:up 1.2s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
@media(max-width:600px){.hero .wrap{grid-template-columns:1fr;text-align:center}.hero .numi-big{max-width:190px}.ask>.nm{width:66px}.bubble{font-size:18px}}
@media(max-width:380px){.logo span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.conf,.plus{display:none}}

/* ---------- sonidos: archivos WAV creados en el navegador (suenan aunque el celular esté en silencio) ---------- */
const SND={};
function wav(notes){
  const sr=22050,tot=notes.reduce((a,n)=>a+n[1],0),len=Math.floor(sr*tot),buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len*2,true);
  let i=0;for(const[fq,d]of notes){const n=Math.floor(sr*d);for(let k=0;k<n&&i<len;k++,i++){const t=k/sr,env=Math.min(1,k/150)*Math.exp(-3.2*t/d);
    const s=(Math.sin(2*Math.PI*fq*t)+.35*Math.sin(4*Math.PI*fq*t))*env*.32;v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true)}}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function applause(){
  const sr=22050,len=Math.floor(sr*2.6),buf=new ArrayBuffer(44+len*2),v=new DataView(buf),x=new Float32Array(len);
  for(let k=0;k<170;k++){const t0=Math.floor(Math.pow(Math.random(),1.25)*sr*2.1),amp=.25+Math.random()*.5,n=Math.floor(sr*.03);
    for(let j=0;j<n&&t0+j<len;j++)x[t0+j]+=(Math.random()*2-1)*amp*Math.exp(-j/(sr*.006))}
  let prev=0;
  for(let i=0;i<len;i++){const hp=x[i]-prev*.6;prev=x[i];const fade=i>len*.7?1-(i-len*.7)/(len*.3):1;v.setInt16(44+i*2,Math.max(-1,Math.min(1,hp*.55*fade))*32767,true)}
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+len*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function sound(name){
  if(S.mute)return;
  try{
    if(!SND.tap){SND.tap=wav([[620,.07]]);SND.key=wav([[760,.05]]);SND.yay=wav([[660,.11],[880,.11],[1175,.26]]);SND.oops=wav([[330,.13],[247,.25]]);SND.star=wav([[1320,.08],[1760,.16]]);SND.fan=wav([[523,.13],[659,.13],[784,.13],[1047,.16],[784,.1],[1047,.45]]);SND.clap=applause()}
    const a=new Audio(SND[name]);a.volume=.8;const p=a.play();if(p)p.catch(()=>{});
  }catch(e){}
}
function speak(t){
  try{const ss=window.speechSynthesis;if(!ss)return false;ss.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));u.lang='es-CO';u.rate=.92;u.pitch=1.25;
    const v=ss.getVoices().find(v=>/^es/i.test(v.lang));if(v)u.voice=v;ss.speak(u);return true}catch(e){return false}
}
try{speechSynthesis.getVoices()}catch(e){}

/* ---------- ayudas visuales de la explicación ---------- */
function grid(a,b,op,res,hi,carry){
  carry=carry||{};
  const da=String(a).split('').reverse(),db=String(b).split('').reverse();
  const w=Math.max(da.length,db.length)+2;
  const cols=fn=>{let h='';for(let c=w-1;c>=0;c--){const v=fn(c);h+=`<span class="${c===hi?'hi':''}">${v==null?'':v}</span>`}return h};
  return `<div class="cg" style="grid-template-columns:repeat(${w},1.45em)">${cols(c=>carry[c]!=null?`<small>${carry[c]}</small>`:'')}${cols(c=>da[c])}${cols(c=>c===w-1?op:db[c])}<i style="grid-column:1/-1"></i>${cols(c=>res[c])}</div>`;
}
const dots=(g,e)=>g*e>60?'':`<div class="dots">${Array.from({length:g},()=>`<span class="grp">${'<i></i>'.repeat(e)}</span>`).join('')}</div>`;
const bar=(n,d,n2)=>`<div class="bar" style="--d:${d}">${Array.from({length:d},(_,k)=>`<span class="${k<n?'on':k<n+(n2||0)?'on2':''}"></span>`).join('')}</div>`;
const fr=(n,d)=>`<span class="fr"><b>${n}</b><b>${d}</b></span>`;
const frS=s=>{const[n,d]=s.split('/');return fr(n,d)};
const parts=n=>{const s=String(n);return s.split('').map((d,i)=>Number(d)*10**(s.length-1-i)).filter(x=>x>0)};
const FW={2:'medio',3:'tercio',4:'cuarto',5:'quinto',6:'sexto',7:'séptimo',8:'octavo',9:'noveno',10:'décimo'};
const fw=(n,d)=>n==1?'un '+FW[d]:n+' '+FW[d]+'s';

/* ---------- pasos de explicación ---------- */
function addSteps(a,b){
  const da=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);
  const n=Math.max(da.length,db.length);let c=0;const res={},car={};
  const st=[{t:`Escribimos ${f(a)} y ${f(b)} uno debajo del otro: unidades con unidades, decenas con decenas. Siempre empezamos por la derecha.`,v:grid(a,b,'+',{},-1)}];
  for(let i=0;i<n;i++){
    const x=da[i]||0,y=db[i]||0,s=x+y+c;
    let t=`Sumamos las <b>${PL[i]}</b>: ${x} + ${y}${c?' + 1 (el que llevábamos)':''} = ${s}.`;
    if(s>=10&&i<n-1){t+=` Escribimos el ${s%10} y llevamos 1 a las ${PL[i+1]}.`;res[i]=s%10;car[i+1]=1}
    else if(s>=10){t+=` Como es la última columna, escribimos ${s}.`;res[i]=s%10;res[i+1]=1}
    else{t+=` Escribimos el ${s}.`;res[i]=s}
    c=s>=10?1:0;st.push({t,v:grid(a,b,'+',{...res},i,{...car})});
  }
  st.push({t:`¡Listo! ${f(a)} + ${f(b)} = <b>${f(a+b)}</b>`});return st;
}
function subSteps(a,b){
  const tp=String(a).split('').reverse().map(Number),db=String(b).split('').reverse().map(Number);
  const n=tp.length,res={},car={};
  const st=[{t:`Escribimos ${f(a)} arriba y ${f(b)} abajo, columna con columna. Empezamos por la derecha.`,v:grid(a,b,'−',{},-1)}];
  for(let i=0;i<n;i++){
    const y=db[i]||0;let t;
    if(tp[i]<y){let j=i+1;while(tp[j]===0){tp[j]=9;car[j]=9;j++}tp[j]-=1;car[j]=tp[j];const old=tp[i];tp[i]+=10;car[i]=tp[i];
      t=`En las <b>${PL[i]}</b>, ${old} es menor que ${y}, así que le pedimos prestado 1 a la columna de la izquierda. Ahora tenemos ${tp[i]}. `}
    else t=`En las <b>${PL[i]}</b>: `;
    const d=tp[i]-y;res[i]=d;t+=`${tp[i]} − ${y} = ${d}.`;
    if(i===n-1&&d===0&&n>1){delete res[i];t+=' Un cero a la izquierda no se escribe.'}
    st.push({t,v:grid(a,b,'−',{...res},i,{...car})});
  }
  st.push({t:`¡Listo! ${f(a)} − ${f(b)} = <b>${f(a-b)}</b>`});return st;
}
function colMulSteps(a,b){
  const da=String(a).split('').reverse().map(Number),res={},car={};let c=0;
  const st=[{t:`Ponemos el ${b} debajo de las unidades. Vamos a multiplicar el ${b} por cada cifra de arriba, empezando por la derecha.`,v:grid(a,b,'×',{},-1)}];
  da.forEach((x,i)=>{const p=x*b+c;let t=`<b>${PL[i]}</b>: ${x} × ${b} = ${x*b}${c?` y le sumamos ${c} que llevábamos = ${p}`:''}.`;
    if(p>=10&&i<da.length-1){t+=` Escribimos el ${p%10} y llevamos ${Math.floor(p/10)}.`;res[i]=p%10;car[i+1]=Math.floor(p/10)}
    else if(p>=10){t+=` Es la última, así que escribimos ${p}.`;res[i]=p%10;res[i+1]=Math.floor(p/10)}
    else{t+=` Escribimos el ${p}.`;res[i]=p}
    c=i<da.length-1?Math.floor(p/10):0;st.push({t,v:grid(a,b,'×',{...res},i,{...car})})});
  st.push({t:`¡Listo! ${f(a)} × ${b} = <b>${f(a*b)}</b>`});return st;
}
function mulTable(a,b){
  const seq=Array.from({length:a},(_,k)=>f(b*(k+1)));
  return [{t:`${a} × ${b} quiere decir <b>${a} grupos de ${b}</b>.`,v:dots(a,b)},
  {t:`Contamos de ${b} en ${b}, ${a} veces: ${seq.join(', ')}.`},
  {t:`¡Listo! ${a} × ${b} = <b>${f(a*b)}</b>`}];
}
function splitMul(a,b,sa){
  const big=sa?a:b,o=sa?b:a,p=parts(big),pr=p.map(x=>x*o);
  const st=[{t:`Para multiplicar ${f(a)} × ${f(b)}, separamos el ${f(big)} en partes fáciles: ${p.map(f).join(' + ')}.`}];
  p.forEach((x,i)=>{const z=String(x).length-1,l=x/10**z;
    st.push({t:`${f(x)} × ${f(o)} = <b>${f(pr[i])}</b>`+(z?` <span class="muted">— truco: ${l} × ${f(o)} = ${f(l*o)} y le agregamos ${z===1?'un cero':z+' ceros'}</span>`:'')})});
  if(p.length>1)st.push({t:`Sumamos los resultados: ${pr.map(f).join(' + ')} = <b>${f(a*b)}</b>`});
  st.push({t:`¡Listo! ${f(a)} × ${f(b)} = <b>${f(a*b)}</b>`});return st;
}
const mulSteps=(a,b)=>a<=10&&b<=10?mulTable(a,b):b<=9?splitMul(a,b,true):splitMul(a,b,false);
function divTable(a,b,q){
  const seq=Array.from({length:q},(_,k)=>f(b*(k+1)));
  return [{t:`${a} ÷ ${b} es repartir ${a} en ${b} grupos iguales. La pregunta es: ¿qué número por ${b} da ${a}?`,v:dots(b,q)},
  {t:`Vamos por la tabla del ${b}: ${seq.join(', ')}. ¡Llegamos a ${a} en ${q} saltos!`},
  {t:`Comprobamos: ${b} × ${q} = ${a}. Entonces ${a} ÷ ${b} = <b>${q}</b>`}];
}
function divSplit(a,b,q){
  const qp=parts(q),ap=qp.map(x=>x*b);
  const st=[{t:`Separamos ${f(a)} en partes que se dividen fácil entre ${b}: ${ap.map(f).join(' + ')}.`}];
  qp.forEach((x,i)=>st.push({t:`${f(ap[i])} ÷ ${b} = <b>${f(x)}</b> <span class="muted">— porque ${b} × ${f(x)} = ${f(ap[i])}</span>`}));
  st.push({t:`Juntamos: ${qp.map(f).join(' + ')} = <b>${f(q)}</b>. Comprobamos: ${b} × ${f(q)} = ${f(a)}`});return st;
}
const divSteps=(a,b,q)=>q<=10&&b<=10?divTable(a,b,q):divSplit(a,b,q);

function numOpts(x){
  const d=x<20?[1,2,3,4]:x<200?[1,2,10,11]:[1,10,100,9,11];
  const c=new Set([x]);
  for(const v of shuf(d.flatMap(k=>[x+k,x-k])).filter(v=>v>=0)){if(c.size>=4)break;c.add(v)}
  return shuf([...c]).map(String);
}
const frOpts=list=>shuf([...new Set(list)].slice(0,4));

function tour(steps,flag){

  const end=()=>{S.tut[flag]=true;save();ov.remove();removeEventListener('resize',draw);try{speechSynthesis.cancel()}catch(e){}};
  function draw(){
    const st=steps[i],el=st.sel&&document.querySelector(st.sel);let spot='<div class="dim"></div>',pos='center';
    if(el){const r=el.getBoundingClientRect(),p=8;spot=`<div class="spot" style="left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px"></div>`;pos=r.top+r.height/2>innerHeight/2?'top':'bottom'}
    ov.innerHTML=`${spot}<div class="tcard ${pos}" role="dialog" aria-label="Tutorial">${NM(st.mood||'happy')}<div class="tbody"><p>${st.t}</p>
    <div class="trow"><button class="tskip" data-tour="skip">Saltar</button><span class="tdots">${steps.map((_,k)=>`<i class="${k==i?'on':''}"></i>`).join('')}</span>
    <button class="tnext" data-tour="next">${i==steps.length-1?'¡Entendido!':'Siguiente'}</button></div></div></div>`;
  }
  function go(){const el=steps[i].sel&&document.querySelector(steps[i].sel);if(el)el.scrollIntoView({block:'center'});requestAnimationFrame(draw);if(i>0&&!S.mute)speak(steps[i].t)}
  ov.addEventListener('click',e=>{e.stopPropagation();const t=e.target.closest('[data-tour]');if(!t)return;sound('tap');
    if(t.dataset.tour=='skip')return end();i++;if(i>=steps.length)return end();go()});
  addEventListener('resize',draw);go();
}

function route(h,fromLoad){routing=true;try{routeIn(h,fromLoad)}finally{routing=false}}
function routeIn(h,fromLoad){
  document.querySelector('.tour')?.remove();document.querySelector('.modal')?.remove();
  if(G&&!G.over)persist();G=null;
  if(h==='inicio')home();
  else if(h==='armario')closetView();

}
addEventListener('hashchange',()=>{

    if(document.querySelector('.modal')){pendingBack=null;route(h);return}

/* casillas */
function setupBoxes(){
  const b=G.q.board,B=[];const add=(k,max)=>(B.push({k,v:'',max:max||1}),B.length-1);
  if(b.type=='col'){
    b.w=Math.max(String(b.a).length,String(b.b).length,b.r)+1;b.res={};b.carry={};
    for(let c=0;c<b.r;c++)b.res[c]=add('r');
    const cs=b.op=='−'?[...Array(String(b.a).length).keys()]:[...Array(b.r).keys()].slice(1);
    cs.forEach(c=>{b.carry[c]=add('c',b.op=='−'?2:1);B[b.carry[c]].next=b.res[c]});
    G.order=[...Array(b.r).keys()].map(c=>b.res[c]);
  }else if(b.type=='frac'){b.num=add('r');b.den=add('r',2);G.order=[b.num,b.den]}
  else{b.res=[...G.q.ans].map(()=>add('r'));G.order=b.res.slice()}
  G.boxes=B;G.sel=G.order[0];
}
function boardHTML(){
  const b=G.q.board,B=G.boxes;
  const bx=i=>`<button class="box ${B[i].k=='c'?'sm':''} ${G.sel===i&&!G.solved?'sel':''} ${B[i].st||''}" data-act="box" data-i="${i}" aria-label="Casilla">${B[i].v}</button>`;
  if(b.type=='col'){
    const da=String(b.a).split('').reverse(),db=String(b.b).split('').reverse(),w=b.w;
    const cols=(fn,cl)=>{let s='';for(let c=w-1;c>=0;c--){const v=fn(c);s+=`<div class="cell ${cl||''}">${v==null?'':v}</div>`}return s};
    return `<div class="colop" style="grid-template-columns:repeat(${w},var(--cw))">
    ${cols(c=>c<b.r&&c<w-1?PLS[c]:'','pl')}
    ${cols(c=>b.carry[c]!=null?bx(b.carry[c]):'','cr')}
    ${cols(c=>da[c])}
    ${cols(c=>c===w-1?`<span class="op">${b.op}</span>`:db[c])}
    <i class="line" style="grid-column:1/-1"></i>
    ${cols(c=>b.res[c]!=null?bx(b.res[c]):'')}</div>`;
  }
  if(b.type=='frac')return `${b.vis||''}<div class="lineop">${b.lhs?`<span>${b.lhs}</span>`:''}<span class="fbox">${bx(b.num)}<i></i>${bx(b.den)}</span></div>`;
  if(b.type=='story')return `<div class="lineop"><span class="boxes">${b.res.map(bx).join('')}</span><span class="unit">${b.unit}</span></div>`;
  return `<div class="lineop"><span>${b.lhs}</span><span class="boxes">${b.res.map(bx).join('')}</span></div>`;
}
const drawBoard=()=>{const el=$('#board');if(el)el.innerHTML=boardHTML();persist()};
function typeDigit(d){
  if(!G||G.solved||S.mode!='write')return;
  const x=G.boxes[G.sel];if(!x)return;sound('key');
  if(x.max>1){x.v=(x.v.length<x.max?x.v:'')+d;x.st='';
    if(x.v.length<x.max&&!(x.k=='c'&&d!=='1'))return drawBoard();
    if(x.k!='c')return drawBoard();}
  else{x.v=d;x.st=''}
  if(x.k=='c')G.sel=x.next;else{const i=G.order.indexOf(G.sel);if(i<G.order.length-1)G.sel=G.order[i+1]}
  drawBoard();
}
function erase(){
  if(!G||G.solved)return;const x=G.boxes[G.sel];sound('key');
  if(x.v){x.v='';x.st=''}else{const i=G.order.indexOf(G.sel);if(i>0){G.sel=G.order[i-1];G.boxes[G.sel].v='';G.boxes[G.sel].st=''}}
  drawBoard();
}
function check(){
  if(!G||G.solved)return;
  const q=G.q,b=q.board,B=G.boxes;let empty=false;const bad=[];
  if(b.type=='col'){const ad=q.ans.split('').reverse();
    for(let c=0;c<b.r;c++){const i=b.res[c],v=B[i].v,e=ad[c]??'';
      if(e===''){if(v!==''&&v!=='0')bad.push(i)}else if(v==='')empty=true;else if(v!==e)bad.push(i)}}
  else if(b.type=='frac'){const[n,d]=q.ans.split('/');const vn=B[b.num].v,vd=B[b.den].v;
    if(!vn||!vd)empty=true;else{if(vn!==n)bad.push(b.num);if(vd!==d)bad.push(b.den)}}
  else{[...q.ans].forEach((e,k)=>{const i=b.res[k];if(B[i].v==='')empty=true;else if(B[i].v!==e)bad.push(i)})}
  if(empty&&!bad.length){feedback('Te falta llenar alguna casilla. ¡Casi lo tienes!','think');sound('tap');return}
  if(bad.length||empty){B.forEach((x,i)=>x.st=bad.includes(i)?'bad':'');if(bad.length)G.sel=bad[0];drawBoard();wrong();return}
  G.order.forEach(i=>B[i].st='good');G.solved=true;drawBoard();win();
}

/* resultados */
function earn(e){
  S.stars+=e;S.earnedAll+=e;G.earned.push(e);save();
  const t=$('#tot');if(t){t.innerHTML=`<b>★</b> ${S.stars}`;t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');
    const r=t.getBoundingClientRect(),p=document.createElement('span');p.className='plus';p.textContent='+'+e+' ★';
    p.style.left=(r.left-10)+'px';p.style.top=(r.bottom+60)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1300)}
}
function feedback(m,mood,win){const fb=$('#fb');fb.className='fb on'+(win?' win':'');fb.innerHTML=NM(mood)+'<span>'+m+'</span>';
  const a=$('.ask>.nm');if(a)a.innerHTML=numi(S.eq,mood)}
function win(){
  const e=G.helped?1:G.tries==0?3:2;earn(e);
  G.streak=G.tries==0&&!G.helped?G.streak+1:0;
  let m=`${pick(OK)} Ganaste ${'★'.repeat(e)}.`;
  if(G.helped){S.learned++;save();m=`¡Aprendiste algo nuevo! Eso vale oro. Ganaste ★.`}
  else if(G.streak>=3)m+=` ¡Llevas ${G.streak} seguidas a la primera!`;
  persist();feedback(m,'happy',true);sound('yay');setTimeout(()=>sound('star'),450);confetti(e*12);
  $('#acts').innerHTML=`<button class="next" data-act="next">${G.i<4?'Siguiente reto':'Ver mis estrellas'}</button>`;
  $('#fb').scrollIntoView({behavior:'smooth',block:'center'});
}
function wrong(){
  G.tries++;G.streak=0;persist();sound('oops');
  if(G.tries>=2&&!G.helped){feedback('Vamos a resolverlo juntas, paso a paso. Mira abajo.','think');openHelp()}else feedback(pick(NO),'think');
}

function makeRound(w,l,grade){
  const g=l==0&&grade>3?grade-1:grade,ops=['add','sub','mul','div'];
  let bag=[];if(w=='prob'){do{bag=shuf([...ops,pick(ops)])}while(bag.some((o,i)=>i&&bag[i-1]===o))}const out=[],seen=new Set();
  for(let i=0;i<5;i++){let q,t=0;do{q=W[w].gen(g,bag[i]);t++}while((seen.has(q.ask)||(i&&out[i-1].ask===q.ask))&&t<12);seen.add(q.ask);out.push(q)}
  return out;
}
function start(w,l,g){g=g||S.grade;G={w,l:+l,g,m:S.mode,i:0,earned:[],streak:0,qs:makeRound(w,+l,g)};nextQ()}
function nextQ(){
  if(G.i>=5)return done();
  const g=G.l==0&&G.g>3?G.g-1:G.g;
  Object.assign(G,{q:G.qs?G.qs[G.i]:W[G.w].gen(g),tries:0,helped:false,step:0,solved:false});
  if(S.mode=='write')setupBoxes();
  persist();play();
}
const show=v=>G.q.kind=='frac'?frS(v):f(v);
function play(){
  setHash('reto');
  const w=W[G.w],q=G.q,wr=S.mode=='write';
  const hello=G.i==0&&S.name?`¡Vamos, ${esc(S.name)}! `:'';
  let body;
  if(wr)body=`<div class="card"><div id="board">${boardHTML()}</div><p class="hint">${q.hint}</p></div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-k="${n}">${n}</button>`).join('')}<button class="del" data-act="del">Borrar</button><button data-act="key" data-k="0">0</button><button class="chk" data-act="check">Comprobar</button></div>`;
  else body=`<div class="card">${q.vis?q.vis:q.eq?`<div class="eq">${q.eq} = ?</div>`:'<p style="text-align:center;font-weight:600">Elige la respuesta correcta</p>'}
   <div class="opts">${q.opts.map(v=>`<button class="opt" data-act="ans" data-v="${v}">${show(v)}</button>`).join('')}</div></div>`;
  app.innerHTML=`<section class="wrap play" style="--c:${w.col}">
  <div class="prog"><span class="tag">${w.name} · Nivel ${G.l+1}</span><div class="dots5">${[0,1,2,3,4].map(k=>`<i class="${k<G.i?'d':k==G.i?'c':''}"></i>`).join('')}</div><b>${G.i+1}/5</b><button class="exit" data-act="askexit">Salir</button></div>
  <div class="ask">${NM()}<div class="bubble">${hello}${q.ask}<br><button class="listen" data-act="say">${SPK}Escuchar a Numi</button></div></div>
  ${body}
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="acts" id="acts"><button class="help-btn" data-act="help">Numi, ¿me ayudas?</button></div>
  <div id="help"></div></section>`;
  if(!S.tut.play)setTimeout(playTour,350);
}
function answer(btn){
  if(G.solved||btn.disabled)return;
  if(btn.dataset.v===G.q.ans){G.solved=true;btn.classList.add('ok');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);win()}
  else{btn.classList.add('no');btn.disabled=true;G.tries++;G.streak=0;sound('oops');
    if(G.tries>=2&&!G.helped){feedback('Vamos a resolverlo juntas, paso a paso. Mira abajo.','think');openHelp()}else feedback(pick(['¡Casi! Inténtalo otra vez.','Mmm, revisa con calma. ¡Tú puedes!']),'think')}
}
function openHelp(){
  if(G.solved)return;
  if(!G.helped){G.helped=true;G.step=0;persist()}
  renderHelp();$('#help').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderHelp(){
  const st=G.q.steps,last=G.step>=st.length-1;
  $('#help').innerHTML=`<div class="help"><h3>${NM()}Numi te explica</h3><ol class="steps">${st.slice(0,G.step+1).map(s=>`<li>${s.t}${s.v?`<div class="vis">${s.v}</div>`:''}</li>`).join('')}</ol>
  ${last?`<p class="after">¡Ahora sube y ${S.mode=='write'?'escribe':'elige'} la respuesta tú misma!</p>`:`<div class="acts"><button class="next" data-act="step">Siguiente paso</button></div>`}</div>`;
}

function done(){
  const tot=G.earned.reduce((a,b)=>a+b,0),k=G.g+'-'+G.w,L=[...(S.prog[k]||[0,0,0])],same=G.g==S.grade;
  const wasOpenNext=ORDER[ORDER.indexOf(G.w)+1]&&isOpen(ORDER[ORDER.indexOf(G.w)+1]);
  L[G.l]=Math.max(L[G.l]||0,tot);S.prog[k]=L;S.saved=null;G.over=true;
  const prizes=[];
  if(same&&L.every(x=>x>0)&&!S.crowns[k]){S.crowns[k]=true;S.stars+=10;S.earnedAll+=10;prizes.push(`<svg viewBox="0 0 44 34"><use href="#crown"/></svg><span>¡Ganaste la corona de ${ISLE[G.w]} y 10 estrellas extra!</span>`)}
  const nx=ORDER[ORDER.indexOf(G.w)+1];
  if(same&&nx&&!wasOpenNext&&isOpen(nx))prizes.push(`<span class="blob" style="--c:${W[nx].col};width:52px;height:46px;font-size:24px;border-width:4px;flex:none">${W[nx].sym}</span><span>¡Desbloqueaste ${ISLE[nx]}!</span>`);
  if(affordNew())prizes.push(`<svg viewBox="0 0 24 24" style="width:40px;height:40px"><use href="#hanger"/></svg><span>¡Ya te alcanza para algo nuevo en el armario de Numi!</span>`);
  save();header();setHash('fin');
  const m=tot>=13?'¡Eres una estrella de las matemáticas!':tot>=9?'¡Muy bien! Cada vez lo haces mejor.':'¡Aprendiste muchísimo hoy! Practicar te hace más fuerte.';
  const nextL=G.l<2?`<button class="big-btn" data-act="level" data-w="${G.w}" data-l="${G.l+1}">Siguiente nivel</button>`:'';
  app.innerHTML=`<section class="wrap done"><div class="numi-big">${numi(S.eq,'happy')}</div>
  <p class="score">★ ${tot} de 15</p><h2>Nivel ${G.l+1} completado. ${m}</h2>
  <div class="medals">${G.earned.map(e=>`<span class="medal">${'★'.repeat(e)}<span class="e">${'★'.repeat(3-e)}</span></span>`).join('')}</div>
  ${prizes.map(p=>`<div class="prize">${p}</div>`).join('')}
  ${nextL}<button class="big-btn alt" data-act="map">Volver al mapa</button>
  ${affordNew()?`<button class="big-btn gold" data-act="closet">Ir al armario</button>`:''}</section>`;
  confetti(prizes.length?70:40);celebrate(tot,prizes.length&&S.crowns[k]&&same);
}
const CHEER=['¡Bravo{n}! ¡Superaste el nivel!','¡Lo lograste{n}! Cada día aprendes más.','¡Eres una campeona de las matemáticas{n}!','¡Qué orgullo{n}! Tu esfuerzo valió la pena.','¡Increíble{n}! Nada te detiene.'];
const SOFT=['¡Muy bien{n}! Lo importante es que aprendiste.','¡Sigue así{n}! Practicando te vuelves más fuerte.','¡Terminaste{n}! Cada error te enseñó algo nuevo.'];
function celebrate(tot,crown){
  sound('fan');setTimeout(()=>sound('clap'),700);
  const n=S.name?', '+S.name:'';
  const t=(crown?'¡Ganaste la corona'+n+'! ¡Eres la reina de esta isla!':pick(tot>=9?CHEER:SOFT).replace('{n}',n));
  if(!S.mute)setTimeout(()=>speak(t),1500);
  const h=$('.done h2');if(h)h.insertAdjacentHTML('beforebegin',`<p class="cheer">${esc(t)}</p>`);
}
function confetti(n){
  const c=['#e9456f','#13998b','#ffc93c','#a45fd1','#3d8bd9'];
  for(let k=0;k<n;k++){const s=document.createElement('span');s.className='conf';
    s.style.cssText=`left:${Math.random()*100}vw;background:${pick(c)};animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(!['ans','key','del','check','item'].includes(a))sound('tap');
  const nm=$('#nm');if(nm){S.name=nm.value.trim()}
  if(a==='map'){if(G&&!G.over)persist();G=null;mapView();scrollTo(0,0)}
  else if(a==='settings'){G=null;home();scrollTo(0,0)}
  else if(a==='mute'){S.mute=!S.mute;save();header();if(!S.mute)sound('star')}
  else if(a==='grade'){S.grade=+b.dataset.g;save();home()}
  else if(a==='mode'){S.mode=b.dataset.m;save();home()}
  else if(a==='go'){S.started=true;save();mapView();scrollTo(0,0)}
  else if(a==='isle'){isleView(b.dataset.w);if(isOpen(b.dataset.w))scrollTo(0,0)}
  else if(a==='retour'){S.tut={};save();S.started=true;mapView();scrollTo(0,0)}
  else if(a==='adult'){adultView();scrollTo(0,0)}
  else if(a==='pvg'){PV.g=+b.dataset.g;PV.qs=null;adultView()}
  else if(a==='pvw'){PV.w=b.dataset.w;PV.qs=null;adultView()}
  else if(a==='pvl'){PV.l=+b.dataset.l;PV.qs=null;adultView()}
  else if(a==='pvnew'){PV.qs=null;adultView()}
  else if(a==='pvplay'){G={w:PV.w,l:PV.l,g:PV.g,m:S.mode,i:0,earned:[],streak:0,qs:PV.qs};PV.qs=null;nextQ();scrollTo(0,0)}
  else if(a==='testall'){S.testAll=!S.testAll;save();toast(S.testAll?'Modo prueba activado: todas las islas abiertas.':'Modo prueba desactivado.');adultView()}
  else if(a==='lvlock')toast('Primero termina el nivel anterior.');
  else if(a==='level'){savedFor(b.dataset.w,+b.dataset.l)?resume():start(b.dataset.w,b.dataset.l);scrollTo(0,0)}
  else if(a==='resume'){resume();scrollTo(0,0)}
  else if(a==='askexit')askExit();
  else if(a==='stay'){document.querySelector('.modal')?.remove();if(pendingBack){pendingBack=null;skipHash='reto';location.hash='reto'}}
  else if(a==='exit'){document.querySelector('.modal')?.remove();persist();
    if(pendingBack){const h=pendingBack;pendingBack=null;route(h)}
    else if(retoPushed){G=null;history.back()}
    else{G=null;mapView();scrollTo(0,0)}}
  else if(a==='closet'){G=null;closetView();scrollTo(0,0)}
  else if(a==='item')itemTap(b.dataset.t,b.dataset.k);
  else if(a==='ans')answer(b);
  else if(a==='box'){if(!G.solved){G.sel=+b.dataset.i;drawBoard()}}
  else if(a==='key')typeDigit(b.dataset.k);
  else if(a==='del')erase();
  else if(a==='check')check();
  else if(a==='say'){if(!speak(G.q.speak))toast('Tu navegador no deja que Numi hable, pero puedes leer la pregunta.')}
  else if(a==='help')openHelp();
  else if(a==='step'){G.step++;persist();renderHelp();const li=document.querySelectorAll('.steps li');li[li.length-1]?.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a==='next'){G.i++;nextQ();scrollTo(0,0)}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='nm'){if(e.key==='Enter'){S.name=e.target.value.trim();S.started=true;save();mapView()}return}
  if(!G||S.mode!='write'||!$('#board'))return;
  if(/^[0-9]$/.test(e.key))typeDigit(e.key);
  else if(e.key==='Backspace'){e.preventDefault();erase()}
  else if(e.key==='Enter')check();
});

{const h=location.hash.slice(1);
 if(!h||h==='base'||h==='fin'){routing=true;S.started?mapView():home();routing=false}
 else route(h,true);}
}
</script>
</body>
</html>
